<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low Poly Grass - InstancedMesh</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #87CEEB;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(5, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Ground plane
        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x3a5f0b });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Create elongated triangle grass blade geometry
        const bladeGeometry = new THREE.BufferGeometry();
        const vertices = new Float32Array([
            0, 0, 0,      // Bottom center
            -0.05, 0, 0,  // Bottom left
            0.05, 0, 0,   // Bottom right
            0, 0.8, 0     // Top point (elongated)
        ]);
        const indices = new Uint16Array([
            0, 1, 3,  // Left triangle
            0, 3, 2   // Right triangle
        ]);
        bladeGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
        bladeGeometry.setIndex(new THREE.BufferAttribute(indices, 1));
        bladeGeometry.computeVertexNormals();

        // Grass material with vertex colors for variation
        const grassMaterial = new THREE.MeshLambertMaterial({
            color: 0x4a9d2e,
            side: THREE.DoubleSide,
            flatShading: true
        });

        // Create instanced mesh
        const grassCount = 5000;
        const instancedGrass = new THREE.InstancedMesh(bladeGeometry, grassMaterial, grassCount);

        // Position each grass blade
        const grassBlade = new THREE.Object3D();
        const areaSize = 20;

        for (let i = 0; i < grassCount; i++) {
            // Random position
            const x = (Math.random() - 0.5) * areaSize;
            const z = (Math.random() - 0.5) * areaSize;

            grassBlade.position.set(x, 0, z);

            // Random rotation
            grassBlade.rotation.y = Math.random() * Math.PI * 2;

            // Random scale for variation
            const scale = 0.7 + Math.random() * 0.6;
            grassBlade.scale.set(scale, scale, scale);

            grassBlade.updateMatrix();
            instancedGrass.setMatrixAt(i, grassBlade.matrix);

            // Random color variation (subtle greens)
            const greenShade = new THREE.Color();
            greenShade.setHSL(0.25 + Math.random() * 0.1, 0.6, 0.3 + Math.random() * 0.2);
            instancedGrass.setColorAt(i, greenShade);
        }

        instancedGrass.instanceMatrix.needsUpdate = true;
        instancedGrass.instanceColor.needsUpdate = true;
        scene.add(instancedGrass);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);

        // Animation
        function animate() {
            requestAnimationFrame(animate);

            // Gentle wind effect
            const time = Date.now() * 0.001;
            for (let i = 0; i < grassCount; i++) {
                instancedGrass.getMatrixAt(i, grassBlade.matrix);
                grassBlade.matrix.decompose(grassBlade.position, grassBlade.quaternion, grassBlade.scale);

                // Add slight sway
                const sway = Math.sin(time + grassBlade.position.x * 0.5 + grassBlade.position.z * 0.5) * 0.1;
                grassBlade.rotation.set(0, grassBlade.rotation.y, sway);

                grassBlade.updateMatrix();
                instancedGrass.setMatrixAt(i, grassBlade.matrix);
            }
            instancedGrass.instanceMatrix.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
