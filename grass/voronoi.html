<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voronoi</title>
    <script src="rhill-voronoi-core.js"></script>
    <style>
        body {
            background: #000;
            overflow: hidden;
        }
        canvas {margin: 0; padding: 0;}
        #voronoiCanvas {
        	position:absolute;
        	top:-130px;
        	left:-130px;
        	z-index:99;
        	transform: scale(0.5);

        }
        #refresh, input {display: block; position: absolute; z-index: 100; padding: 8px;}
    </style>
</head>
<body>
    <button id="refresh">refresh</button>

    <canvas id="voronoiCanvas" width="512" height="512"></canvas>
      <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

    <script>

        var img1 = new Image();
        img1.onload = function () {
            gen();
        };

        img1.src = 'vigniette.png';


    	let refresh = document.getElementById("refresh");
		refresh.addEventListener('click', () => {
			gen()
		});


       // voronoi
        const canvas = document.getElementById('voronoiCanvas');
        const ctx = canvas.getContext('2d');
        const bbox = { xl: 0, xr: 512, yt: 0, yb: 512 };
        const voronoi = new Voronoi();

       function gen() {
		ctx.fillStyle = "white";
		ctx.fillRect(0, 0, 512, 512);

       	 const numSites = 50;
        const sites = [];
        for (let i = 0; i < numSites; i++) {
            sites.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height
            });
        }

        const diagram = voronoi.compute(sites, bbox);

        diagram.cells.forEach(cell => {
            const edges = cell.halfedges;
            if (edges.length < 3) return;

            ctx.beginPath();
            const start = edges[0].getStartpoint();
            ctx.moveTo(start.x, start.y);

            for (let i = 0; i < edges.length; i++) {
                const edge = edges[i];
                const end = edge.getEndpoint();
                ctx.lineTo(end.x, end.y);
            }
            ctx.closePath();

            let d = distance(start.x, start.y, 256, 256);
            // let d = Math.random()*255;

            ctx.fillStyle = 'rgb('+ d +','+ d +','+ d +')';
            ctx.strokeStyle = 'rgb('+ d +','+ d +','+ d +')';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.stroke();
        });

        // white border around canvas
		ctx.strokeStyle = "white";
		ctx.lineWidth = 5;
		ctx.strokeRect(0, 0, 512, 512);
        
        //    
        ctx.drawImage(img1, 0, 0, 512, 512);
        // ctx.filter = "blur(4px)";

        material.map.needsUpdate = true;          
        material.displacementMap.needsUpdate = true;

       }// gen



        // distacte to
		function distance(x1, y1, x2, y2) {
		  return Math.sqrt((x2 - x1)*(x2 - x1) + (y2 - y1)*(y2 - y1));
		}







// three.js
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );

const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setSize( window.innerWidth, window.innerHeight );
document.body.appendChild( renderer.domElement );

camera.position.set(0,2,6);

// var light = new THREE.DirectionalLight(0xffffff, 1);
// light.position.setScalar(100);
// scene.add(light);
// scene.add(new THREE.AmbientLight(0xffffff, 0.25));
        
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(-3, 15, -8);
dirLight.castShadow = true;
dirLight.shadow.camera.top = 4;
dirLight.shadow.camera.bottom = -4;
dirLight.shadow.camera.left = -4;
dirLight.shadow.camera.right = 4;
dirLight.shadow.camera.near = 0.1;
dirLight.shadow.camera.far = 40;
dirLight.shadow.radius = 8;
scene.add(dirLight);


// plane
const geometry = new THREE.PlaneGeometry( 10, 10, 1024, 1024);
window.material = new THREE.MeshStandardMaterial({
      color:0xff0000,
      map : new THREE.CanvasTexture(canvas),
      displacementMap: new THREE.CanvasTexture(canvas),
      displacementScale: -3,
      displacementBias: 3,
      metalness: 0.01,
      roughness: 0.9,
      side: THREE.DoubleSide
    });
const ground = new THREE.Mesh( geometry, material );
ground.castShadow = true;
ground.receiveShadow = true;
ground.rotation.x = -Math.PI / 2;
scene.add( ground );

//
var controls = new THREE.OrbitControls( camera, renderer.domElement );


// window resize
window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  camera.updateProjectionMatrix();
  renderer.setSize( window.innerWidth, window.innerHeight );
}, false)

// loop
function animate() {
  requestAnimationFrame( animate );
  renderer.render( scene, camera );
};

  // START <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<
  animate();

    </script>
</body>
</html>
