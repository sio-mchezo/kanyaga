<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pong</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: none;
    }
    #score {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 6px;
      text-shadow: 0 0 20px rgba(0, 160, 255, 0.6);
      pointer-events: none;
      z-index: 10;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="score">0 : 0</div>
  <canvas id="court"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r109/three.min.js"></script>
  <script>
    (() => {
      const COURT = { halfWidth: 5.4, halfHeight: 3.6, depth: 24, paddleHalf: 1.05, ballRadius: 0.38 };
      const WIN_SCORE = 4;
      const STEP = 1 / 120;
      const MAX_BALL_SPEED = 36;
      const MAX_PADDLE_SPEED = 24;
      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
      const paddleXLimit = COURT.halfWidth - COURT.paddleHalf;
      const paddleYLimit = COURT.halfHeight - COURT.paddleHalf;
      const ballXLimit = COURT.halfWidth - COURT.ballRadius;
      const ballYLimit = COURT.halfHeight - COURT.ballRadius;

      function reflectedPosition(value, limit) {
        const span = limit * 2;
        const folded = ((value + limit) % (span * 2) + span * 2) % (span * 2);
        return folded <= span ? folded - limit : span * 2 - folded - limit;
      }

      class GamePhysics {
        constructor(random = Math.random) {
          this.random = random;
          this.events = [];
          this.player = { x: 0, y: 0, vx: 0, vy: 0 };
          this.opponent = { x: 0, y: 0 };
          this.ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, spinX: 0, spinY: 0 };
          this.scores = { human: 0, computer: 0 };
          this.charge = 0;
          this.charging = false;
          this.start(1);
        }
        start(level) {
          this.level = clamp(Math.floor(level) || 1, 1, 12);
          this.state = 'ready';
          this.scores.human = 0;
          this.scores.computer = 0;
          Object.assign(this.player, { x: 0, y: 0, vx: 0, vy: 0 });
          Object.assign(this.opponent, { x: 0, y: 0 });
          this.elapsed = 0;
          this.rally = 0;
          this._accumulator = 0;
          this._pointTime = 0;
          this._aiTime = 0;
          this._aiTarget = { x: 0, y: 0 };
          this._opponentVelocity = { x: 0, y: 0 };
          this.charge = 0;
          this.charging = false;
          this.events.length = 0;
          this._readyBall();
        }
        setPaddle(x, y, dt = 1 / 60) {
          const nextX = clamp(x, -paddleXLimit, paddleXLimit);
          const nextY = clamp(y, -paddleYLimit, paddleYLimit);
          const sampleTime = Math.max(dt, 1 / 240);
          let vx = (nextX - this.player.x) / sampleTime;
          let vy = (nextY - this.player.y) / sampleTime;
          const speed = Math.hypot(vx, vy);
          if (speed > MAX_PADDLE_SPEED) {
            vx *= MAX_PADDLE_SPEED / speed;
            vy *= MAX_PADDLE_SPEED / speed;
          }
          Object.assign(this.player, { x: nextX, y: nextY, vx, vy });
          if (this.state === 'ready') this._readyBall();
        }
        serve() {
          if (this.state !== 'ready') return false;
          this.state = 'playing';
          this.rally = 0;
          this._accumulator = 0;
          this._aiTime = 0;
          Object.assign(this.ball, {
            x: this.player.x, y: this.player.y, z: COURT.ballRadius + 0.25,
            vx: (this.random() - 0.5) * 2.8, vy: (this.random() - 0.5) * 1.8,
            vz: 13.5 + this.level * 0.35, spinX: 0, spinY: 0,
          });
          this.player.vx = 0;
          this.player.vy = 0;
          return true;
        }
        update(dt) {
          if (this.state === 'ready' || this.state === 'won' || this.state === 'lost') {
            this._accumulator = 0;
            return;
          }
          this._accumulator += Math.min(dt, 0.1);
          while (this._accumulator >= STEP) {
            this._accumulator -= STEP;
            if (this.state === 'playing') this._step(STEP);
            else if (this.state === 'point') {
              this._pointTime -= STEP;
              if (this._pointTime <= 0) {
                this.state = 'ready';
                this._readyBall();
              }
            }
            if (this.state === 'ready' || this.state === 'won' || this.state === 'lost') {
              this._accumulator = 0;
              break;
            }
          }
        }
        _readyBall() {
          Object.assign(this.ball, {
            x: this.player.x, y: this.player.y, z: COURT.ballRadius + 0.25,
            vx: 0, vy: 0, vz: 0, spinX: 0, spinY: 0,
          });
        }
        _step(dt) {
          this.elapsed += dt;
          const decay = Math.exp(-dt / 0.085);
          this.player.vx *= decay;
          this.player.vy *= decay;
          if (this.charging) {
            this.charge = Math.min(1, this.charge + dt * 0.9);
          } else {
            this.charge = Math.max(0, this.charge - dt * 3);
          }
          this._moveOpponent(dt);
          const b = this.ball;
          b.vx += b.spinX * dt;
          b.vy += b.spinY * dt;
          const spinDecay = Math.exp(-dt * 0.18);
          b.spinX *= spinDecay;
          b.spinY *= spinDecay;
          this._capSpeed();
          this._travel(dt);
        }
        _moveOpponent(dt) {
          this._aiTime -= dt;
          if (this._aiTime <= 0) {
            this._aiTime += Math.max(0.055, 0.25 - this.level * 0.016);
            if (this.ball.vz > 0) {
              const travelTime = Math.max(0, (COURT.depth - COURT.ballRadius - this.ball.z) / this.ball.vz);
              const anticipation = 0.2 + this.level * 0.053;
              const lookAhead = travelTime * anticipation;
              const uncertainty = 0.65 * (1 - this.level / 13);
              this._aiTarget.x = clamp(
                reflectedPosition(this.ball.x + this.ball.vx * lookAhead + this.ball.spinX * lookAhead ** 2 * 0.5, ballXLimit) +
                  (this.random() - 0.5) * uncertainty,
                -paddleXLimit, paddleXLimit
              );
              this._aiTarget.y = clamp(
                reflectedPosition(this.ball.y + this.ball.vy * lookAhead + this.ball.spinY * lookAhead ** 2 * 0.5, ballYLimit) +
                  (this.random() - 0.5) * uncertainty,
                -paddleYLimit, paddleYLimit
              );
            } else {
              this._aiTarget.x = this.ball.x * 0.15;
              this._aiTarget.y = this.ball.y * 0.15;
            }
          }
          const dx = this._aiTarget.x - this.opponent.x;
          const dy = this._aiTarget.y - this.opponent.y;
          const dist = Math.hypot(dx, dy);
          const move = Math.min(dist, (2.6 + this.level * 0.4) * dt);
          const frac = dist > 1e-9 ? move / dist : 0;
          const mx = dx * frac;
          const my = dy * frac;
          this.opponent.x = clamp(this.opponent.x + mx, -paddleXLimit, paddleXLimit);
          this.opponent.y = clamp(this.opponent.y + my, -paddleYLimit, paddleYLimit);
          this._opponentVelocity.x = mx / dt;
          this._opponentVelocity.y = my / dt;
        }
        _travel(dt) {
          const b = this.ball;
          let remaining = dt;
          for (let i = 0; i < 6 && remaining > 1e-9; i++) {
            let time = remaining;
            let collision = null;
            const consider = (t, kind) => {
              if (t >= -1e-9 && t <= time + 1e-9) {
                time = clamp(t, 0, remaining);
                collision = kind;
              }
            };
            if (b.vx > 1e-9) consider((ballXLimit - b.x) / b.vx, 'x');
            else if (b.vx < -1e-9) consider((-ballXLimit - b.x) / b.vx, 'x');
            if (b.vy > 1e-9) consider((ballYLimit - b.y) / b.vy, 'y');
            else if (b.vy < -1e-9) consider((-ballYLimit - b.y) / b.vy, 'y');
            if (b.vz > 1e-9) consider((COURT.depth - COURT.ballRadius - b.z) / b.vz, 'computer');
            else if (b.vz < -1e-9) consider((COURT.ballRadius - b.z) / b.vz, 'human');

            b.x += b.vx * time;
            b.y += b.vy * time;
            b.z += b.vz * time;
            remaining -= time;
            if (!collision) break;
            if (collision === 'x' || collision === 'y') {
              b[`v${collision}`] *= -1;
              b[collision === 'x' ? 'spinX' : 'spinY'] *= 0.8;
              this.events.push({ type: 'wall', axis: collision, x: b.x, y: b.y, z: b.z });
            } else {
              const paddle = collision === 'human' ? this.player : this.opponent;
              if (this._touchesPaddle(paddle)) this._hit(collision, paddle);
              else {
                this._score(collision === 'human' ? 'computer' : 'human');
                break;
              }
            }
          }
        }
        _touchesPaddle(paddle) {
          const dx = Math.max(0, Math.abs(this.ball.x - paddle.x) - COURT.paddleHalf);
          const dy = Math.max(0, Math.abs(this.ball.y - paddle.y) - COURT.paddleHalf);
          return dx * dx + dy * dy <= COURT.ballRadius ** 2 + 1e-9;
        }
        _hit(actor, paddle) {
          const b = this.ball;
          const speed = Math.min(MAX_BALL_SPEED, Math.hypot(b.vx, b.vy, b.vz) + 0.65 + this.level * 0.025);
          const offsetX = clamp((b.x - paddle.x) / COURT.paddleHalf, -1.15, 1.15);
          const offsetY = clamp((b.y - paddle.y) / COURT.paddleHalf, -1.15, 1.15);
          const vx = actor === 'human' ? this.player.vx : this._opponentVelocity.x;
          const vy = actor === 'human' ? this.player.vy : this._opponentVelocity.y;
          b.vx = offsetX * speed * 0.39 + vx * 0.12;
          b.vy = offsetY * speed * 0.34 + vy * 0.1;
          const sideways = Math.hypot(b.vx, b.vy);
          if (sideways > speed * 0.72) {
            b.vx *= speed * 0.72 / sideways;
            b.vy *= speed * 0.72 / sideways;
          }
          b.vz = (actor === 'human' ? 1 : -1) * Math.sqrt(Math.max(0, speed ** 2 - b.vx ** 2 - b.vy ** 2));
          const swipe = actor === 'human' ? 0.56 : 0.24 + this.level * 0.018;
          b.spinX = clamp(vx * swipe, -11, 11);
          b.spinY = clamp(-vy * swipe, -11, 11);

          if (actor === 'human' && this.charge > 0.02) {
            const boost = 1 + this.charge * 0.55;
            b.vx *= boost;
            b.vy *= boost;
            b.vz *= boost;
            b.spinX *= 1 + this.charge * 1.2;
            b.spinY *= 1 + this.charge * 1.2;
            this.events.push({ type: 'charged', power: this.charge });
            this.charge = 0;
          }

          this.rally++;
          this.events.push({ type: 'hit', actor, x: b.x, y: b.y, z: b.z, rally: this.rally });
        }
        _capSpeed() {
          const b = this.ball;
          const speed = Math.hypot(b.vx, b.vy, b.vz);
          if (speed > MAX_BALL_SPEED) {
            const s = MAX_BALL_SPEED / speed;
            b.vx *= s;
            b.vy *= s;
            b.vz *= s;
          }
        }
        _score(winner) {
          this.scores[winner]++;
          this.events.push({ type: 'score', winner, scores: { ...this.scores } });
          this.ball.vx = this.ball.vy = this.ball.vz = 0;
          this.player.vx = this.player.vy = 0;
          this.charge = 0;
          if (this.scores[winner] >= WIN_SCORE) {
            this.state = winner === 'human' ? 'won' : 'lost';
            this.events.push({ type: 'match', winner });
          } else {
            this.state = 'point';
            this._pointTime = 1;
          }
        }
      }

      const { halfWidth: W, halfHeight: H, depth: D, ballRadius: R } = COURT;

      class CourtRenderer {
        constructor(canvas) {
          this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          this.renderer.setClearColor(0x000000);
          this.scene = new THREE.Scene();
          this.scene.fog = new THREE.Fog(0x000000, 9, 60);
          this.camera = new THREE.PerspectiveCamera(56.55, 1.5, 0.1, 100);
          this.camera.position.set(0, 0, 9.2);
          this.camera.lookAt(0, 0, -D / 2);

          this.grid = new THREE.Group();
          this.scene.add(this.grid);
          this.gridLines = [];

          const zSteps = 20;
          for (let i = 0; i <= zSteps; i++) {
            const z = (i / zSteps) * D;
            const line = this.line(
              [new THREE.Vector3(-W, -H, -z), new THREE.Vector3(W, -H, -z),
               new THREE.Vector3(W, H, -z), new THREE.Vector3(-W, H, -z),
               new THREE.Vector3(-W, -H, -z)],
              i === 0 ? 0x35c42b : 0x397d29,
              i === 0 ? 0.95 : 0.6
            );
            this.grid.add(line);
            this.gridLines.push({ line, z });
          }

          this.player = this.paddle(0xb32429, 0xff5533);
          this.opponent = this.paddle(0x2042da, 0x5577ff);
          this.scene.add(this.player, this.opponent);
          this.opponent.position.z = -D;

          const sphere = new THREE.SphereGeometry(R, 36, 24);
          for (const face of sphere.faces) {
            const verts = [sphere.vertices[face.a], sphere.vertices[face.b], sphere.vertices[face.c]];
            const x = verts.reduce((a, p) => a + p.x, 0);
            const y = verts.reduce((a, p) => a + p.y, 0);
            face.color.setHex(x * y > 0 ? 0x32ef20 : 0x066cf5);
          }
          this.ball = new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({ vertexColors: THREE.FaceColors, fog: false }));
          this.scene.add(this.ball);

          this.resize();
        }

        line(points, color, opacity = 1) {
          return new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(points),
            new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: false })
          );
        }

        paddle(color, chargeColor) {
          const g = new THREE.Group();

          const polar = new THREE.PolarGridHelper(
            COURT.paddleHalf,
            1,
            3,
            64,
            color,
            color
          );
          polar.rotation.x = Math.PI/2;
          polar.material.transparent = true;
          polar.material.opacity = 0.85;
          polar.material.depthWrite = false;
          g.add(polar);

          const disc = new THREE.Mesh(
            new THREE.CircleGeometry(COURT.paddleHalf, 64),
            new THREE.MeshBasicMaterial({
              color,
              transparent: true,
              opacity: 0.12,
              side: THREE.DoubleSide,
              depthWrite: false
            })
          );
          disc.position.z = -0.005;
          g.add(disc);

          const chargeDisc = new THREE.Mesh(
            new THREE.CircleGeometry(1, 64),
            new THREE.MeshBasicMaterial({
              color: chargeColor,
              transparent: true,
              opacity: 0,
              side: THREE.DoubleSide,
              depthWrite: false
            })
          );
          chargeDisc.position.z = 0.004;
          chargeDisc.scale.set(0, 0, 1);
          g.add(chargeDisc);

          g.chargeDisc = chargeDisc;
          g.chargeColor = new THREE.Color(chargeColor);
          g.renderOrder = 3;
          return g;
        }

        resize() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          this.renderer.setSize(w, h, false);
          this.camera.aspect = w / h;
          this.camera.updateProjectionMatrix();
        }

        pointer(clientX, clientY) {
          const rect = this.renderer.domElement.getBoundingClientRect();
          const p = new THREE.Vector3(
            ((clientX - rect.left) / rect.width) * 2 - 1,
            1 - ((clientY - rect.top) / rect.height) * 2,
            0.5
          ).unproject(this.camera);
          const dir = p.sub(this.camera.position).normalize();
          const hit = this.camera.position.clone().add(dir.multiplyScalar(-this.camera.position.z / dir.z));
          return { x: hit.x, y: hit.y };
        }

        render(game, dt) {
          this.player.position.set(game.player.x, game.player.y, 0.012);
          this.opponent.position.set(game.opponent.x, game.opponent.y, -D + 0.012);
          this.ball.position.set(game.ball.x, game.ball.y, -game.ball.z);

          const ballR = COURT.ballRadius;
          const vx = game.ball.vx;
          const vy = game.ball.vy;
          const spinX = game.ball.spinX;
          const spinY = game.ball.spinY;

          const rollX = vy / ballR;
          const rollY = -vx / ballR;
          const totalOmegaX = rollX + spinX;
          const totalOmegaY = rollY + spinY;

          const angle = Math.hypot(totalOmegaX, totalOmegaY) * dt;
          if (angle > 1e-6) {
            const axis = new THREE.Vector3(totalOmegaX, totalOmegaY, 0).normalize();
            this.ball.rotateOnWorldAxis(axis, angle);
          }

          // charge disc on player paddle
          const charge = game.charge;
          const disc = this.player.chargeDisc;
          if (charge > 0.001) {
            const maxRadius = COURT.paddleHalf * 0.98;
            const r = charge * maxRadius;
            disc.scale.set(r, r, 1);
            disc.material.opacity = 0.55 * charge + 0.15;
            const hot = new THREE.Color(0xffdd22).lerp(new THREE.Color(0xff2266), charge);
            disc.material.color.copy(hot);
          } else {
            disc.material.opacity = 0;
          }

          const ballZ = game.ball.z;
          for (const entry of this.gridLines) {
            const dist = Math.abs(ballZ - entry.z);
            const flash = Math.max(0, 1 - dist / 2.5);
            const baseOpacity = entry.z === 0 ? 0.95 : 0.6;
            entry.line.material.opacity = baseOpacity + flash * 0.4;
            entry.line.material.color.setHex(0x397d29).lerp(new THREE.Color(0x88ff88), flash * 0.8);
          }

          this.renderer.render(this.scene, this.camera);
        }
      }

      const canvas = document.getElementById('court');
      const scoreEl = document.getElementById('score');
      let renderer;
      try {
        renderer = new CourtRenderer(canvas);
      } catch (e) {
        document.body.innerHTML = '<h1 style="color:white;text-align:center;margin-top:40vh">WebGL not available</h1>';
        return;
      }

      const game = new GamePhysics();
      let lastTime = performance.now();
      let touch = null;
      let lastPointer = 0;
      let spaceDownAt = 0;

      function resize() {
        renderer.resize();
      }
      window.addEventListener('resize', resize);

      function movePointer(e) {
        const point = renderer.pointer(e.clientX, e.clientY);
        const dt = Math.max(1 / 240, Math.min(0.1, (e.timeStamp - lastPointer) / 1000 || 1 / 60));
        lastPointer = e.timeStamp;
        if (e.pointerType === 'touch') {
          if (!touch || touch.id !== e.pointerId) return;
          const x = touch.paddleX + (point.x - touch.x) * 1.0;
          const y = touch.paddleY + (point.y - touch.y) * 1.0;
          game.setPaddle(x, y, dt);
        } else {
          game.setPaddle(point.x, point.y, dt);
        }
      }

      canvas.addEventListener('pointermove', movePointer);
      canvas.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') {
          const point = renderer.pointer(e.clientX, e.clientY);
          touch = { id: e.pointerId, x: point.x, y: point.y, paddleX: game.player.x, paddleY: game.player.y };
          canvas.setPointerCapture(e.pointerId);
        } else {
          movePointer(e);
        }
        if (game.state === 'ready') game.serve();
        game.charging = true;
        e.preventDefault();
      });
      for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture'])
        canvas.addEventListener(ev, () => {
          touch = null;
          game.charging = false;
        });

      window.addEventListener('keydown', e => {
        if (e.key === ' ' && !e.repeat) {
          e.preventDefault();
          spaceDownAt = performance.now();
          game.charging = true;
        }
      });
      window.addEventListener('keyup', e => {
        if (e.key === ' ') {
          game.charging = false;
          if (performance.now() - spaceDownAt < 200 && game.state === 'ready') game.serve();
        }
      });

      function updateScore() {
        scoreEl.textContent = `${game.scores.human} : ${game.scores.computer}`;
      }

      function frame(time) {
        const dt = Math.min(0.05, Math.max(0, (time - lastTime) / 1000 || 0));
        lastTime = time;

        game.update(dt);

        const events = game.events.splice(0);
        for (const ev of events) {
          if (ev.type === 'score' || ev.type === 'match') {
            updateScore();
          }
        }

        if (game.state === 'won' || game.state === 'lost') {
          setTimeout(() => game.start(game.level), 800);
        }

        renderer.render(game, dt);
        requestAnimationFrame(frame);
      }

      updateScore();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
