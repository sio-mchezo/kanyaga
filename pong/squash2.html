<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: none; }
  </style>
</head>
<body>
  <canvas id="court"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r109/three.min.js"></script>
  <script>
    (() => {
      const COURT = { halfWidth: 5.4, halfHeight: 3.6, depth: 24, paddleHalf: 1.05, ballRadius: 0.38 };
      const STEP = 1 / 120;
      const MAX_BALL_SPEED = 36;
      const MAX_PADDLE_SPEED = 24;
      const MAX_BALL_SPEED_SQ = MAX_BALL_SPEED * MAX_BALL_SPEED;
      const MIN_BALL_SPEED = 12;
      const MIN_BALL_SPEED_SQ = MIN_BALL_SPEED * MIN_BALL_SPEED;
      const CAMERA_Z = 9.2;
      const CAMERA_FOV = 56.55;
      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

      let paddleXLimit = COURT.halfWidth - COURT.paddleHalf;
      let paddleYLimit = COURT.halfHeight - COURT.paddleHalf;
      let ballXLimit = COURT.halfWidth - COURT.ballRadius;
      let ballYLimit = COURT.halfHeight - COURT.ballRadius;

      function updateCourtExtents(aspect) {
        const halfH = Math.tan(CAMERA_FOV * Math.PI / 360) * CAMERA_Z;
        const halfW = halfH * aspect;
        COURT.halfWidth = halfW;
        COURT.halfHeight = halfH;
        paddleXLimit = halfW - COURT.paddleHalf;
        paddleYLimit = halfH - COURT.paddleHalf;
        ballXLimit = halfW - COURT.ballRadius;
        ballYLimit = halfH - COURT.ballRadius;
      }

      function createPhysics(random = Math.random) {
        const player = { x: 0, y: 0, vx: 0, vy: 0 };
        const ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, spinX: 0, spinY: 0 };
        const events = [];

        const api = {
          state: 'ready',
          player,
          ball,
          events,
          start, setPaddle, serve, update,
        };

        let accumulator = 0;
        let pointTime = 0;

        function readyBall() {
          ball.x = player.x;
          ball.y = player.y;
          ball.z = COURT.ballRadius + 0.25;
          ball.vx = 0;
          ball.vy = 0;
          ball.vz = 0;
          ball.spinX = 0;
          ball.spinY = 0;
        }

        function start() {
          api.state = 'ready';
          player.x = 0; player.y = 0; player.vx = 0; player.vy = 0;
          accumulator = 0;
          pointTime = 0;
          events.length = 0;
          readyBall();
        }

        function setPaddle(x, y, dt = 1 / 60) {
          // x, y are the raw finger position.
          // boost the paddle's reach as the finger approaches the screen edge.
          const edgeStart = 0.7; // fraction of half-court where the boost begins
          const edgeMax = 1.8;   // extra multiplier at the very edge

          const fx = clamp(x / paddleXLimit, -1, 1);
          const fy = clamp(y / paddleYLimit, -1, 1);

          const bx = Math.max(0, Math.abs(fx) - edgeStart) / (1 - edgeStart);
          const by = Math.max(0, Math.abs(fy) - edgeStart) / (1 - edgeStart);

          const boostX = 1 + bx * (edgeMax - 1);
          const boostY = 1 + by * (edgeMax - 1);

          const nextX = clamp(x * boostX, -paddleXLimit, paddleXLimit);
          const nextY = clamp(y * boostY, -paddleYLimit, paddleYLimit);

          const sampleTime = Math.max(dt, 1 / 240);
          let vx = (nextX - player.x) / sampleTime;
          let vy = (nextY - player.y) / sampleTime;
          const speedSq = vx * vx + vy * vy;
          if (speedSq > MAX_PADDLE_SPEED * MAX_PADDLE_SPEED) {
            const scale = MAX_PADDLE_SPEED / Math.sqrt(speedSq);
            vx *= scale;
            vy *= scale;
          }
          player.x = nextX; player.y = nextY; player.vx = vx; player.vy = vy;
          if (api.state === 'ready') readyBall();
        }

        function serve() {
          if (api.state !== 'ready') return false;
          api.state = 'playing';
          accumulator = 0;
          ball.x = player.x;
          ball.y = player.y;
          ball.z = COURT.ballRadius + 0.25;
          ball.vx = (random() - 0.5) * 2.8;
          ball.vy = (random() - 0.5) * 1.8;
          ball.vz = 18;
          ball.spinX = 0;
          ball.spinY = 0;
          player.vx = 0;
          player.vy = 0;
          events.push({ type: 'serve' });
          return true;
        }

        function update(dt) {
          if (api.state === 'ready') {
            accumulator = 0;
            return;
          }
          accumulator += dt < 0.1 ? dt : 0.1;
          while (accumulator >= STEP) {
            accumulator -= STEP;
            if (api.state === 'playing') step(STEP);
            else if (api.state === 'point') {
              pointTime -= STEP;
              if (pointTime <= 0) {
                api.state = 'ready';
                readyBall();
              }
            }
            if (api.state === 'ready') {
              accumulator = 0;
              break;
            }
          }
        }

        function step(dt) {
          const decay = Math.exp(-dt / 0.085);
          player.vx *= decay;
          player.vy *= decay;
          ball.vx += ball.spinX * dt;
          ball.vy += ball.spinY * dt;
          const spinDecay = Math.exp(-dt * 0.18);
          ball.spinX *= spinDecay;
          ball.spinY *= spinDecay;
          enforceBallSpeed();
          travel(dt);
        }

        function travel(dt) {
          let remaining = dt;
          for (let i = 0; i < 6 && remaining > 1e-9; i++) {
            let time = remaining;
            let collision = null;

            const consider = (t, kind) => {
              if (t >= -1e-9 && t <= time + 1e-9) {
                time = clamp(t, 0, remaining);
                collision = kind;
              }
            };

            if (ball.vx > 1e-9) consider((ballXLimit - ball.x) / ball.vx, 'x+');
            else if (ball.vx < -1e-9) consider((-ballXLimit - ball.x) / ball.vx, 'x-');
            if (ball.vy > 1e-9) consider((ballYLimit - ball.y) / ball.vy, 'y+');
            else if (ball.vy < -1e-9) consider((-ballYLimit - ball.y) / ball.vy, 'y-');
            if (ball.vz > 1e-9) consider((COURT.depth - COURT.ballRadius - ball.z) / ball.vz, 'z+');
            else if (ball.vz < -1e-9) consider((COURT.ballRadius - ball.z) / ball.vz, 'z-');

            ball.x += ball.vx * time;
            ball.y += ball.vy * time;
            ball.z += ball.vz * time;
            remaining -= time;

            if (!collision) break;

            if (collision === 'x+' || collision === 'x-') {
              ball.vx *= -1;
              ball.spinX *= 0.85;
              events.push({ type: 'wall', axis: 'x', x: ball.x, y: ball.y, z: ball.z });
            } else if (collision === 'y+' || collision === 'y-') {
              ball.vy *= -1;
              ball.spinY *= 0.85;
              events.push({ type: 'wall', axis: 'y', x: ball.x, y: ball.y, z: ball.z });
            } else if (collision === 'z+') {
              ball.vz *= -1;
              ball.spinX *= 0.9;
              ball.spinY *= 0.9;
              events.push({ type: 'wall', axis: 'z', x: ball.x, y: ball.y, z: ball.z });
            } else {
              if (touchesPaddle(player)) hit(player);
              else {
                score();
                break;
              }
            }
          }
        }

        function touchesPaddle(paddle) {
          const dx = Math.max(0, Math.abs(ball.x - paddle.x) - COURT.paddleHalf);
          const dy = Math.max(0, Math.abs(ball.y - paddle.y) - COURT.paddleHalf);
          return dx * dx + dy * dy <= COURT.ballRadius * COURT.ballRadius + 1e-9;
        }

        function hit(paddle) {
          const incoming = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy + ball.vz * ball.vz);
          const speed = Math.min(MAX_BALL_SPEED, incoming + 1.2);
          const offsetX = clamp((ball.x - paddle.x) / COURT.paddleHalf, -1.15, 1.15);
          const offsetY = clamp((ball.y - paddle.y) / COURT.paddleHalf, -1.15, 1.15);
          ball.vx = offsetX * speed * 0.39 + player.vx * 0.12;
          ball.vy = offsetY * speed * 0.34 + player.vy * 0.1;
          const sidewaysSq = ball.vx * ball.vx + ball.vy * ball.vy;
          const sideways = Math.sqrt(sidewaysSq);
          const cap = speed * 0.72;
          if (sideways > cap) {
            const s = cap / sideways;
            ball.vx *= s;
            ball.vy *= s;
          }
          const vzSq = speed * speed - ball.vx * ball.vx - ball.vy * ball.vy;
          ball.vz = Math.sqrt(vzSq > 0 ? vzSq : 0);
          ball.spinX = clamp(player.vx * 0.56, -11, 11);
          ball.spinY = clamp(-player.vy * 0.56, -11, 11);
          enforceBallSpeed();
          events.push({ type: 'hit', x: ball.x, y: ball.y, z: ball.z });
        }

        function enforceBallSpeed() {
          const speedSq = ball.vx * ball.vx + ball.vy * ball.vy + ball.vz * ball.vz;
          if (speedSq > MAX_BALL_SPEED_SQ) {
            const s = MAX_BALL_SPEED / Math.sqrt(speedSq);
            ball.vx *= s;
            ball.vy *= s;
            ball.vz *= s;
          } else if (speedSq > 1e-6 && speedSq < MIN_BALL_SPEED_SQ) {
            const s = MIN_BALL_SPEED / Math.sqrt(speedSq);
            ball.vx *= s;
            ball.vy *= s;
            ball.vz *= s;
          }
        }

        function score() {
          events.push({ type: 'score' });
          ball.vx = ball.vy = ball.vz = 0;
          player.vx = player.vy = 0;
          api.state = 'point';
          pointTime = 1;
        }

        return api;
      }

      const { depth: D, ballRadius: R } = COURT;

      function createRenderer(canvas) {
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setClearColor(0x000000);
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 9, 60);
        const camera = new THREE.PerspectiveCamera(CAMERA_FOV, 1.5, 0.1, 100);
        camera.position.set(0, 0, CAMERA_Z);
        camera.lookAt(0, 0, -D / 2);

        const grid = new THREE.Group();
        scene.add(grid);
        const gridLines = [];

        function makeLine(points, color, opacity = 1) {
          return new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(points),
            new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: false })
          );
        }

        function rebuildGrid() {
          while (grid.children.length) grid.remove(grid.children[0]);
          gridLines.length = 0;

          const W = COURT.halfWidth;
          const H = COURT.halfHeight;

          const zSteps = 20;
          for (let i = 0; i <= zSteps; i++) {
            const z = (i / zSteps) * D;
            const isEdge = i === 0 || i === zSteps;
            const line = makeLine(
              [new THREE.Vector3(-W, -H, -z), new THREE.Vector3(W, -H, -z),
               new THREE.Vector3(W, H, -z), new THREE.Vector3(-W, H, -z),
               new THREE.Vector3(-W, -H, -z)],
              isEdge ? 0x35c42b : 0x397d29,
              isEdge ? 0.95 : 0.6
            );
            grid.add(line);
            gridLines.push({ line, z, edge: isEdge });
          }
        }

        function makePaddle(color) {
          const g = new THREE.Group();

          const polar = new THREE.PolarGridHelper(COURT.paddleHalf, 1, 3, 64, color, color);
          polar.rotation.x = Math.PI / 2;
          polar.material.transparent = true;
          polar.material.opacity = 0.85;
          polar.material.depthWrite = false;
          g.add(polar);

          const disc = new THREE.Mesh(
            new THREE.CircleGeometry(COURT.paddleHalf, 64),
            new THREE.MeshBasicMaterial({
              color, transparent: true, opacity: 0.12,
              side: THREE.DoubleSide, depthWrite: false
            })
          );
          disc.position.z = -0.005;
          g.add(disc);

          g.renderOrder = 3;
          return g;
        }

        const player = makePaddle(0xb32429);
        scene.add(player);

        const sphere = new THREE.SphereGeometry(R, 36, 24);
        for (const face of sphere.faces) {
          const verts = [sphere.vertices[face.a], sphere.vertices[face.b], sphere.vertices[face.c]];
          const x = verts.reduce((a, p) => a + p.x, 0);
          const y = verts.reduce((a, p) => a + p.y, 0);
          face.color.setHex(x * y > 0 ? 0xcccccc : 0x999999);
        }
        const ballMesh = new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({ vertexColors: THREE.FaceColors, fog: false }));
        scene.add(ballMesh);

        const axisTmp = new THREE.Vector3();
        const colorGreenBase = new THREE.Color(0x397d29);
        const colorGreenFlash = new THREE.Color(0x88ff88);
        const colorTmp = new THREE.Color();

        function resize() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          const dpr = window.devicePixelRatio || 1;
          const aspect = w / h;

          renderer.setPixelRatio(dpr);
          renderer.setSize(w, h, false);

          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';

          renderer.setViewport(0, 0, w, h);
          camera.aspect = aspect;
          camera.updateProjectionMatrix();

          updateCourtExtents(aspect);
          rebuildGrid();
        }

        function pointer(clientX, clientY) {
          const rect = renderer.domElement.getBoundingClientRect();
          const p = new THREE.Vector3(
            ((clientX - rect.left) / rect.width) * 2 - 1,
            1 - ((clientY - rect.top) / rect.height) * 2,
            0.5
          ).unproject(camera);
          const dir = p.sub(camera.position).normalize();
          const hit = camera.position.clone().add(dir.multiplyScalar(-camera.position.z / dir.z));
          return { x: hit.x, y: hit.y };
        }

        function render(game, dt) {
          player.position.set(game.player.x, game.player.y, 0.012);
          ballMesh.position.set(game.ball.x, game.ball.y, -game.ball.z);

          const vx = game.ball.vx;
          const vy = game.ball.vy;
          const spinX = game.ball.spinX;
          const spinY = game.ball.spinY;
          const rollX = vy / R;
          const rollY = -vx / R;
          const totalOmegaX = rollX + spinX;
          const totalOmegaY = rollY + spinY;
          const omegaSq = totalOmegaX * totalOmegaX + totalOmegaY * totalOmegaY;
          if (omegaSq > 1e-12) {
            const len = Math.sqrt(omegaSq);
            axisTmp.set(totalOmegaX / len, totalOmegaY / len, 0);
            ballMesh.rotateOnWorldAxis(axisTmp, len * dt);
          }

          const ballZ = game.ball.z;
          for (let i = 0; i < gridLines.length; i++) {
            const entry = gridLines[i];
            const dist = Math.abs(ballZ - entry.z);
            const flash = dist < 2.5 ? 1 - dist / 2.5 : 0;
            const baseOpacity = entry.edge ? 0.95 : 0.6;
            entry.line.material.opacity = baseOpacity + flash * 0.4;
            colorTmp.copy(colorGreenBase).lerp(colorGreenFlash, flash * 0.8);
            entry.line.material.color.copy(colorTmp);
          }

          renderer.render(scene, camera);
        }

        return { resize, pointer, render };
      }

      const canvas = document.getElementById('court');
      const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

      let renderer;
      try {
        renderer = createRenderer(canvas);
      } catch (e) {
        document.body.innerHTML = '<h1 style="color:white;text-align:center;margin-top:40vh">WebGL not available</h1>';
        return;
      }

      const game = createPhysics();
      let lastTime = performance.now();
      let touch = null;
      let lastPointer = 0;

      function resize() { renderer.resize(); }
      window.addEventListener('resize', resize);
      resize();

      function movePointer(e) {
        const point = renderer.pointer(e.clientX, e.clientY);
        const dt = Math.max(1 / 240, Math.min(0.1, (e.timeStamp - lastPointer) / 1000 || 1 / 60));
        lastPointer = e.timeStamp;
        if (e.pointerType === 'touch') {
          if (!touch || touch.id !== e.pointerId) return;
          const x = touch.paddleX + (point.x - touch.x);
          const y = touch.paddleY + (point.y - touch.y);
          game.setPaddle(x, y, dt);
        } else {
          game.setPaddle(point.x, point.y, dt);
        }
      }

      canvas.addEventListener('pointermove', movePointer);
      canvas.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') {
          const point = renderer.pointer(e.clientX, e.clientY);
          touch = { id: e.pointerId, x: point.x, y: point.y, paddleX: game.player.x, paddleY: game.player.y };
          canvas.setPointerCapture(e.pointerId);
          if (game.state === 'ready') game.serve();
        } else {
          movePointer(e);
          if (game.state === 'ready') game.serve();
        }
        e.preventDefault();
      });
      for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture'])
        canvas.addEventListener(ev, () => { touch = null; });

      window.addEventListener('keydown', e => {
        if (e.key === ' ' && !e.repeat) {
          e.preventDefault();
          if (game.state === 'ready') game.serve();
        }
      });

      function frame(time) {
        const dt = Math.min(0.05, Math.max(0, (time - lastTime) / 1000 || 0));
        lastTime = time;

        game.update(dt);
        game.events.length = 0;

        renderer.render(game, dt);
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
