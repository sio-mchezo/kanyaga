// Get a random funny word from our array
function getRandomFunnyWord() {
    return funnyWords[Math.floor(Math.random() * funnyWords.length)];
}

// Helper functions
function getRandomWord(category) {
    if (category === 'funnyWord') {
        return getRandomFunnyWord();
    }
    
    const words = dictionary[category];
    if (words && Array.isArray(words)) {
        const choice = words[Math.floor(Math.random() * words.length)];
        return choice;
    }
    return `[${category}]`;
}

function expandSymbol(symbol, customVariables = {}) {
    // Prevent infinite recursion and handle kidName specially
    if (symbol === 'kidName') {
        return customVariables['kidName'] || 'Rafiki';
    }
    
    const options = dictionary[symbol];
    if (!options) {
        // If symbol doesn't exist, try to get a random word from it
        return getRandomWord(symbol);
    }
    
    const choice = options[Math.floor(Math.random() * options.length)];
    
    return choice.replace(/#(\w+)#/g, (match, symbol) => {
        return expandSymbol(symbol, customVariables);
    });
}

// Main story generator
function generateKidsStory(playerName = "Rafiki") {
    const customVariables = {
        'kidName': playerName
    };
    
    const story = expandSymbol('origin', customVariables);
    
    // Validate that we have a real story
    if (story.includes('[') && story.includes(']')) {
        // If story contains unresolved symbols, try one more time
        return generateKidsStory(playerName);
    }
    
    return story;
}

// LocalStorage functions
function saveName() {
    const nameInput = document.getElementById('player-name');
    const name = nameInput.value.trim();
    if (name) {
        localStorage.setItem('playerName', name);
        alert(`Jina limehifadhiwa: ${name}`);
        generateNewStory();
    } else {
        alert('Tafadhali weka jina!');
    }
}

function loadName() {
    return localStorage.getItem('playerName') || 'Rafiki';
}

function generateNewStory() {
    const playerName = loadName();
    const story = generateKidsStory(playerName);
    document.getElementById('story').textContent = story;
}

// Initialize on load
window.onload = function() {
    const savedName = loadName();
    if (savedName !== 'Rafiki') {
        document.getElementById('player-name').value = savedName;
    }
    generateNewStory();
};
