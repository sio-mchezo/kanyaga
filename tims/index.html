	<script>

// player
player = {
  width:768,
  size:256,

};

	var num = 0;
	var scene = new THREE.Scene();
	var clock = new THREE.Clock();

	var camera = new THREE.PerspectiveCamera( 85, window.innerWidth/window.innerHeight, 0.1, 1000 );

	var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
	renderer.setSize( window.innerWidth, window.innerHeight );
	document.body.appendChild( renderer.domElement );
	

	// scene.position.x = -5;
	// scene.position.y = -2;

	camera.position.x = 3;
	camera.position.y = 3;
	camera.position.z = 3;

	var controls	= new THREE.OrbitControls(camera);
	controls.enablePan = false;
	controls.enableDamping = true;
	controls.dampingFactor = 0.9;
	controls.maxPolarAngle = Math.PI * 0.49;
	controls.maxDistance = 15;
	controls.minDistance = 2;
	// controls.target.set( -5, 0, 0 );



	var light = new THREE.AmbientLight( 0xffffff );
	light.intensity = 1;
	scene.add( light );

	// the background cubes
	var bgcubes = [];
	var tyres = [];

	// the car
	var loader = new THREE.BufferGeometryLoader();

	loader.load(
		'carbody.json', // or carbody.json
		function ( geometry ) {
			var material = new THREE.MeshBasicMaterial( { 
				color: 0xE3D6C4,
			 } );
			var object = new THREE.Mesh( geometry, material );
			scene.add( object );
		},
		function ( xhr ) {},
		function ( xhr ) {console.log( 'An error happened' );}
	);


	loader.load(
		'bars.json', // or carbody.json
		function ( geometry ) {
			var material = new THREE.MeshBasicMaterial( { 
				color: 0x333333,
			 } );
			var object = new THREE.Mesh( geometry, material );
			scene.add( object );
		},
		function ( xhr ) {},
		function ( xhr ) {console.log( 'An error happened' );}
	);


// tyre
var geometry = new THREE.RingBufferGeometry(0.18, 0.38, 26, 1)

var material = new THREE.MeshBasicMaterial( { 
	color: 0xbdb09d,
 side: THREE.DoubleSide,
 transparent:true,
 opacity:0.3
  } );

var material2 = new THREE.MeshBasicMaterial( { 
	color: 0xffffff,
	 // side: THREE.DoubleSide
  } );


var mesh = new THREE.Mesh( geometry, material );
mesh.position.set(1.168, 0.200, -0.846)

scene.add( mesh );
tyres.push(mesh);

var tyre2 = mesh.clone();
tyre2.position.set(1.168, 0.200, 0.846)
scene.add( tyre2 );
tyres.push(tyre2);

var tyre3 = mesh.clone();
tyre3.position.set(-0.987, 0.20, 0.846)
scene.add( tyre3 );
tyres.push(tyre3);

var tyre4 = mesh.clone();
tyre4.position.set(-0.987, 0.20, -0.846)
scene.add( tyre4 );
tyres.push(tyre4);

var tyre5 = mesh.clone();
tyre5.position.set(-1.8, 1, 0)
tyre5.rotation.y = -Math.PI/2;
tyre5.material = material2;
scene.add( tyre5 );


// groups
cameragoal = new THREE.Group();
scene.add( cameragoal );





    makerocks();




	// handle window resize
	window.addEventListener('resize', function(){
	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize( window.innerWidth, window.innerHeight );
	}, false)


	var animate = function () {
		requestAnimationFrame( animate );
		renderer.render( scene, camera );
		animateBG()
	};

	animate();


// rocks
function makerocks() {
for ( var i = 0; i < 100; i ++ ) {
      var sc = Math.random()*0.4;
      var material = new THREE.MeshLambertMaterial( {
      	color: 0xa59e7a
      } );
      var geometry = new THREE.BoxGeometry( sc, sc, sc );
      var mesh = new THREE.Mesh( geometry, material );
          mesh.scale.set(sc, sc, sc);
          mesh.position.x = ( Math.random() - 0.5 ) * 12;
          mesh.position.z = ( Math.random() - 0.5 ) * 12;
		
		// leave space in center
		if ( Math.abs( mesh.position.z ) < 2 && Math.abs( mesh.position.z ) < 13 ) continue;


          mesh.position.y = sc/2;
          scene.add( mesh );
          bgcubes.push(mesh)

  }

// road
var geometry = new THREE.PlaneBufferGeometry( 80, 2, 1 );
var material = new THREE.MeshBasicMaterial( {
	// color: 0xffff00
	map : new THREE.TextureLoader().load( 'trans2.png' )
	, transparent: true,
	opacity:0.3
	// ,alphaTest:true
	, side: THREE.DoubleSide
} );
var plane = new THREE.Mesh( geometry, material );
plane.rotation.x = -Math.PI/2;
plane.position.x = -20;
plane.position.y = -0.2;
scene.add( plane );

}// make rocks



// make the cubes GOOOoooooo!!!

// helper.rotation.y += 0.01;

for ( var i = 0; i < bgcubes.length; i ++ ) { 
  bgcubes[i].position.x -= 0.1;

  if (bgcubes[i].position.x < -3) {
    bgcubes[i].position.x = 3;
  }
}

for ( var i = 0; i < tyres.length; i ++ ) { 
  tyres[i].position.y = (Math.random()/20) + 0.2;
}
