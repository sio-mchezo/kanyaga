<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
<title>Kanga Cloth</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111111;font-family:sans-serif}

  #container{position:fixed;inset:0}

  #topbar{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:12px;
    z-index:10;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }

  .arrow{
    width:48px;
    height:48px;
    background:#e8e8e8;
    border:2px solid #000;
    box-shadow:4px 4px 0 #000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
    color:#000;
    cursor:pointer;
    transition:transform 0.05s, box-shadow 0.05s;
    touch-action:none;
  }
  .arrow:active{
    transform:translate(3px,3px);
    box-shadow:1px 1px 0 #000;
  }

  #num{
    width:80px;
    height:48px;
    background:#e8e8e8;
    border:2px solid #000;
    box-shadow:4px 4px 0 #000;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    color:#000;
    outline:none;
    -moz-appearance:textfield;
    touch-action:none;
  }
  #num::-webkit-outer-spin-button,
  #num::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
</style>
</head>
<body>
<div id="container"></div>

<div id="topbar">
  <div class="arrow" id="prev">◀</div>
  <input type="number" id="num" value="1" min="1">
  <div class="arrow" id="next">▶</div>
</div>

<script src="ammo.wasm.js"></script>
<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.150.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

let container, camera, scene, renderer;
const clock = new THREE.Clock();

const gravityConstant = -9.8;
let physicsWorld;
let cloth;
let transformAux1;
let clothWidth, clothHeight, clothNumSegmentsZ, clothNumSegmentsY, clothPos;
let clothImpulse = 0;

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const pointer3D = new THREE.Vector3();
let pointerActive = false;
let pointerStrength = 0;

let sayings = [];
let currentIndex = 0;
let clothTexture;
let clothCanvas, clothCtx;
let cachedColor = null;

Ammo().then(function (AmmoLib) {
  window.Ammo = AmmoLib;
  init();
  animate();
});

function randomKangaColor() {
  const h = Math.random() * 360;
  const s = 55 + Math.random() * 25;
  const l = 35 + Math.random() * 15;
  return `hsl(${h}, ${s}%, ${l}%)`;
}

function makeClothTexture() {
  clothCanvas = document.createElement('canvas');
  clothCanvas.width = 1024;
  clothCanvas.height = 512;
  clothCtx = clothCanvas.getContext('2d');

  drawPhrase('');

  clothTexture = new THREE.CanvasTexture(clothCanvas);
  clothTexture.anisotropy = 8;
  return clothTexture;
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let current = '';

  for (const word of words) {
    const test = current ? current + ' ' + word : word;
    if (ctx.measureText(test).width <= maxWidth) {
      current = test;
    } else {
      if (current) lines.push(current);
      current = word;
    }
  }
  if (current) lines.push(current);
  return lines;
}

function drawPhrase(text, eng) {
  const ctx = clothCtx;
  const canvas = clothCanvas;

  if (!cachedColor) cachedColor = randomKangaColor();
  ctx.fillStyle = cachedColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!text) {
    if (clothTexture) clothTexture.needsUpdate = true;
    return;
  }

  const targetBoxW = canvas.width * 0.4;
  const maxTextW = targetBoxW - 30;

  const wordCount = text.trim().split(/\s+/).length;
  const maxLines = wordCount <= 8 ? 1 : 2;

  let fontSize = 60;
  let lines = [];

  while (fontSize > 14) {
    ctx.font = `bold ${fontSize}px sans-serif`;
    lines = maxLines === 1 ? [text] : wrapText(ctx, text, maxTextW);
    const fitsWidth = lines.every(l => ctx.measureText(l).width <= maxTextW);
    if (fitsWidth && lines.length <= maxLines) break;
    fontSize -= 1;
  }

  ctx.font = `bold ${fontSize}px sans-serif`;

  const lineHeight = fontSize * 1.15;
  const textH = lineHeight * lines.length;
  let maxLineW = 0;
  for (const l of lines) {
    const w = ctx.measureText(l).width;
    if (w > maxLineW) maxLineW = w;
  }

  const pad = 12;
  const boxW = maxLineW + pad * 2;
  const boxH = textH + pad * 2;
  const boxX = (canvas.width - boxW) / 2;
  const boxY = (canvas.height - boxH) / 2 + canvas.height * 0.3;

  // Subtle gradient: 5% black bottom-left, transparent top-right
  const grad = ctx.createLinearGradient(0, canvas.height, canvas.width, 0);
  grad.addColorStop(0, 'rgba(0, 0, 0, 0.3)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.globalAlpha = 0.9;

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 6;
  ctx.strokeRect(boxX, boxY, boxW, boxH);

  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const cx = canvas.width / 2;
  const cy = boxY + boxH / 2;
  const startY = cy - (lines.length - 1) * lineHeight / 2;

  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], cx, startY + i * lineHeight);
  }

  if (eng) {
    ctx.save();
    ctx.globalAlpha = 0.6 * 0.9;
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    let engFontSize = 28;
    ctx.font = `bold ${engFontSize}px sans-serif`;
    let engLines = wrapText(ctx, eng, boxW);

    while (engLines.length > 2 && engFontSize > 12) {
      engFontSize -= 1;
      ctx.font = `bold ${engFontSize}px sans-serif`;
      engLines = wrapText(ctx, eng, boxW);
    }

    const engLineHeight = engFontSize * 1.2;
    const engCenterY = canvas.height / 2 - 10;
    const engStartY = engCenterY - (engLines.length - 1) * engLineHeight / 2;

    for (let i = 0; i < engLines.length; i++) {
      ctx.fillText(engLines[i], canvas.width / 2, engStartY + i * engLineHeight);
    }

    ctx.restore();
  }

  ctx.restore();

  if (clothTexture) clothTexture.needsUpdate = true;
}

function setSaying(i) {
  if (!sayings.length) return;
  currentIndex = ((i % sayings.length) + sayings.length) % sayings.length;
  const s = sayings[currentIndex];
  cachedColor = randomKangaColor();
  drawPhrase(s.swa, s.eng);
  document.getElementById('num').value = s.num;
  clothImpulse = 0.05;
}

function init() {
  initGraphics();
  initPhysics();
  createObjects();
  initPointer();
  initControls();
  loadSayings();
}

function loadSayings() {
  fetch('kangas.json')
    .then(r => r.json())
    .then(data => {
      sayings = data.kanga_sayings || [];
      if (sayings.length) {
        document.getElementById('num').max = sayings.length;
        setSaying(0);
      }
    })
    .catch(() => {
      sayings = [{ num: 1, swa: 'Haraka haraka haina baraka', eng: '' }];
      setSaying(0);
    });
}

function initControls() {
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const num = document.getElementById('num');

  let holdTimer = null;
  let holdInterval = null;

  function startHold(direction) {
    setSaying(currentIndex + direction);
    holdTimer = setTimeout(() => {
      holdInterval = setInterval(() => {
        setSaying(currentIndex + direction);
      }, 16);
    }, 350);
  }

  function stopHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
  }

  prev.addEventListener('pointerdown', e => { e.preventDefault(); startHold(-1); });
  next.addEventListener('pointerdown', e => { e.preventDefault(); startHold(1); });
  prev.addEventListener('pointerup', stopHold);
  next.addEventListener('pointerup', stopHold);
  prev.addEventListener('pointerleave', stopHold);
  next.addEventListener('pointerleave', stopHold);
  prev.addEventListener('pointercancel', stopHold);
  next.addEventListener('pointercancel', stopHold);

  num.addEventListener('change', () => {
    const v = parseInt(num.value, 10);
    if (isNaN(v)) { num.value = sayings[currentIndex].num; return; }
    const idx = sayings.findIndex(s => s.num === v);
    if (idx >= 0) setSaying(idx);
    else num.value = sayings[currentIndex].num;
  });

  window.addEventListener('wheel', e => {
    if (!sayings.length) return;
    setSaying(currentIndex + (e.deltaY > 0 ? 1 : -1));
  }, { passive: true });
}

function initGraphics() {
  container = document.getElementById('container');

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.2, 2000);
  camera.position.set(0, 3.5, 10);
  camera.lookAt(0, 3.5, 0);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
  scene.add(ambientLight);

  const light = new THREE.DirectionalLight(0xffffff, 1.6);
  light.position.set(0, 12, 8);
  light.shadow.intensity = 0.7;
  light.target.position.set(0, 3.5, 0);
  light.castShadow = true;
  const d = 15;
  light.shadow.camera.left = -d;
  light.shadow.camera.right = d;
  light.shadow.camera.top = d;
  light.shadow.camera.bottom = -d;
  light.shadow.camera.near = 1;
  light.shadow.camera.far = 40;
  light.shadow.mapSize.set(2048, 2048);
  light.shadow.bias = -0.0005;
  light.shadow.normalBias = 0.02;
  light.shadow.radius = 4;
  scene.add(light);
  scene.add(light.target);

  window.addEventListener('resize', onWindowResize);
}

function initPhysics() {
  const collisionConfiguration = new Ammo.btSoftBodyRigidBodyCollisionConfiguration();
  const dispatcher = new Ammo.btCollisionDispatcher(collisionConfiguration);
  const broadphase = new Ammo.btDbvtBroadphase();
  const solver = new Ammo.btSequentialImpulseConstraintSolver();
  const softBodySolver = new Ammo.btDefaultSoftBodySolver();
  physicsWorld = new Ammo.btSoftRigidDynamicsWorld(dispatcher, broadphase, solver, collisionConfiguration, softBodySolver);
  physicsWorld.setGravity(new Ammo.btVector3(0, gravityConstant, 0));
  physicsWorld.getWorldInfo().set_m_gravity(new Ammo.btVector3(0, gravityConstant, 0));
  transformAux1 = new Ammo.btTransform();
}

function createObjects() {
  clothWidth = 16;
  clothHeight = 10;
  clothNumSegmentsZ = clothWidth*2;
  clothNumSegmentsY = clothHeight*2;
  clothPos = new THREE.Vector3(-clothWidth / 2, 11, 0);

  const clothGeometry = new THREE.PlaneGeometry(clothWidth, clothHeight, clothNumSegmentsZ, clothNumSegmentsY);

  const clothMaterial = new THREE.MeshLambertMaterial({
    map: makeClothTexture(),
    side: THREE.DoubleSide
  });
  cloth = new THREE.Mesh(clothGeometry, clothMaterial);
  cloth.castShadow = true;
  cloth.receiveShadow = true;
  scene.add(cloth);

  // Invisible kinematic arm at the top edge
  const armShape = new Ammo.btBoxShape(new Ammo.btVector3(clothWidth * 0.5, 0.1, 0.1));
  const armTransform = new Ammo.btTransform();
  armTransform.setIdentity();
  armTransform.setOrigin(new Ammo.btVector3(clothPos.x + clothWidth / 2, clothPos.y, clothPos.z));

  const armMotionState = new Ammo.btDefaultMotionState(armTransform);
  const armInertia = new Ammo.btVector3(0, 0, 0);
  const armInfo = new Ammo.btRigidBodyConstructionInfo(0, armMotionState, armShape, armInertia);
  const armBody = new Ammo.btRigidBody(armInfo);
  armBody.setCollisionFlags(armBody.getCollisionFlags() | 2); // CF_KINEMATIC_OBJECT
  armBody.setActivationState(4); // DISABLE_DEACTIVATION
  physicsWorld.addRigidBody(armBody);

  // Cloth soft body
  const softBodyHelpers = new Ammo.btSoftBodyHelpers();
  const clothCorner00 = new Ammo.btVector3(clothPos.x-2, clothPos.y, clothPos.z);
  const clothCorner01 = new Ammo.btVector3(clothPos.x + clothWidth+2, clothPos.y, clothPos.z);
  const clothCorner10 = new Ammo.btVector3(clothPos.x, clothPos.y - clothHeight, clothPos.z);
  const clothCorner11 = new Ammo.btVector3(clothPos.x + clothWidth, clothPos.y - clothHeight, clothPos.z);
  const clothSoftBody = softBodyHelpers.CreatePatch(
    physicsWorld.getWorldInfo(),
    clothCorner00, clothCorner01, clothCorner10, clothCorner11,
    clothNumSegmentsZ + 1, clothNumSegmentsY + 1, 0, true
  );
  clothSoftBody.get_m_materials().at(0).set_m_kLST(0.4);
  clothSoftBody.get_m_materials().at(0).set_m_kAST(0.4);
  const sbConfig = clothSoftBody.get_m_cfg();
  sbConfig.set_viterations(5);
  sbConfig.set_piterations(5);
  

  clothSoftBody.setTotalMass(1.0, false);
  Ammo.castObject(clothSoftBody, Ammo.btCollisionObject).getCollisionShape().setMargin(0.05 * 3);
  physicsWorld.addSoftBody(clothSoftBody, 1, -1);
  cloth.userData.physicsBody = clothSoftBody;
  clothSoftBody.setActivationState(4);

  
  const influence = 0.5;
  clothSoftBody.appendAnchor(0, armBody, false, influence);
  clothSoftBody.appendAnchor(clothNumSegmentsZ, armBody, false, influence);
  
  for (let i = 0; i < 30; i++) {
    clothSoftBody.setMass(i, 0);
  }

}

function initPointer() {
  window.addEventListener('pointerdown', e => {
    if (e.target.closest('#topbar')) return;
    pointerActive = true;
    pointerStrength = 1.0;
    updatePointer(e);
  });
  window.addEventListener('pointerup', () => {
    pointerActive = false;
    pointerStrength = 0;
  });
  window.addEventListener('pointerleave', () => {
    pointerActive = false;
    pointerStrength = 0;
  });
  window.addEventListener('pointermove', e => {
    if (e.target.closest('#topbar')) return;
    updatePointer(e);
    if (pointerActive) pointerStrength = 1.0;
  });
}

function updatePointer(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  raycaster.ray.intersectPlane(plane, pointer3D);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  const deltaTime = clock.getDelta();
  updatePhysics(deltaTime);
  renderer.render(scene, camera);
}

function updatePhysics(deltaTime) {
  const softBody = cloth.userData.physicsBody;
  const nodes = softBody.get_m_nodes();
  const numNodes = nodes.size();

  if (pointerStrength > 0.001) {

    const radius = 5.0;
    const force = pointerStrength * 20.0;

    for (let i = 0; i < numNodes; i++) {
      const node = nodes.at(i);
      if (node.get_m_im() === 0) continue;
      const pos = node.get_m_x();
      const dx = pos.x() - pointer3D.x;
      const dy = pos.y() - pointer3D.y;
      const dz = pos.z() - pointer3D.z;
      const distSq = dx * dx + dy * dy + dz * dz;
      if (distSq < radius * radius) {
        const dist = Math.sqrt(distSq) + 0.001;
        const falloff = 1.0 - dist / radius;
        const f = force * falloff * deltaTime;
        node.get_m_v().setX(node.get_m_v().x() + (dx / dist) * f * -1);
        node.get_m_v().setY(node.get_m_v().y() + (dy / dist) * f * -1);
        node.get_m_v().setZ(node.get_m_v().z() + (dz / dist) * f * -1);
      }
    }
  }

  if (clothImpulse > 0.001) {
    for (let i = 0; i < numNodes; i++) {
      const node = nodes.at(i);
      if (node.get_m_im() === 0) continue;
      node.get_m_v().setZ(node.get_m_v().z() + clothImpulse * deltaTime * 10);
    }
    clothImpulse *= 0.65;
  }

  physicsWorld.stepSimulation(deltaTime, 10);

  const clothPositions = cloth.geometry.attributes.position.array;
  const numVerts = clothPositions.length / 3;
  let indexFloat = 0;

  for (let i = 0; i < numVerts; i++) {
    const node = nodes.at(i);
    const nodePos = node.get_m_x();
    clothPositions[indexFloat++] = nodePos.x();
    clothPositions[indexFloat++] = nodePos.y();
    clothPositions[indexFloat++] = nodePos.z();
  }

  cloth.geometry.computeVertexNormals();
  cloth.geometry.attributes.position.needsUpdate = true;
  cloth.geometry.attributes.normal.needsUpdate = true;
}
</script>
</body>
</html>
