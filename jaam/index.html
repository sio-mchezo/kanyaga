  <script>
class Calendar {
    constructor() {
        this.currentDate = new Date();
        this.currentDate.setDate(1);
        this.currentDay = 0;
        this.animationId = null;
        this.speed = 100;
        this.running = true;
        this.days = [];
        
        this.init();
        this.startAnimation();
    }
    
    getDaysInMonth() {
        const year = this.currentDate.getFullYear();
        const month = this.currentDate.getMonth();
        return new Date(year, month + 1, 0).getDate();
    }
    
    getFirstDayOfMonth() {
        const year = this.currentDate.getFullYear();
        const month = this.currentDate.getMonth();
        return new Date(year, month, 1).getDay();
    }
    
    updateDateDisplay() {
        const dateElement = document.getElementById('date');
        const options = { year: 'numeric', month: 'short' };
        dateElement.textContent = this.currentDate.toLocaleDateString('en-US', options);
    }
    
    init() {
        const cal = document.getElementById('cal');
        cal.innerHTML = '';
        this.days = [];
        
        this.updateDateDisplay();
        const totalDays = this.getDaysInMonth();
        const firstDay = this.getFirstDayOfMonth();
        
        const daysNeeded = Math.ceil((totalDays + firstDay) / 7) * 7;
        
        for (let i = 0; i < daysNeeded; i++) {
            const day = document.createElement('div');
            day.className = 'day';
            
            if (i < firstDay || i >= firstDay + totalDays) {
                day.classList.add('grey');
            } else {
                const dayNumber = i - firstDay + 1;
                if (dayNumber === 1) {
                    day.classList.add('current');
                } else {
                    day.classList.add('grey');
                }
            }
            
            this.days.push(day);
            cal.appendChild(day);
        }
        
        const slider = document.getElementById('speedSlider');
        slider.addEventListener('input', (e) => {
            this.speed = parseInt(e.target.value);
        });
        
        const toggle = document.getElementById('startStopToggle');
        toggle.addEventListener('click', () => {
            this.running = !this.running;
            toggle.textContent = this.running ? 'stop' : 'start';
            toggle.classList = this.running ? 'stop' : 'start';
            
            if (this.running) {
                this.startAnimation();
            } else {
                this.stopAnimation();
            }
        });
    }
    
    updateDay() {
        const totalDays = this.getDaysInMonth();
        const firstDay = this.getFirstDayOfMonth();
        
        if (this.currentDay > 0 && this.currentDay <= totalDays) {
            const prevIndex = firstDay + this.currentDay - 1;
            this.days[prevIndex].classList.remove('current');
            this.days[prevIndex].classList.add('past');
        }
        
        if (this.currentDay < totalDays) {
            const currentIndex = firstDay + this.currentDay;
            this.days[currentIndex].classList.remove('grey');
            this.days[currentIndex].classList.add('current');
            this.currentDay++;
        } else {
            this.currentDay = 0;
            this.currentDate.setMonth(this.currentDate.getMonth() + 1);
            this.init();
        }
    }
    
    startAnimation() {
        if (this.animationId) return;
        
        const animate = () => {
            if (this.running) {
                this.updateDay();
            }
            this.animationId = setTimeout(() => {
                requestAnimationFrame(animate);
            }, 1000 - (this.speed * 0.99));
        };
        
        animate();
    }
    
    stopAnimation() {
        if (this.animationId) {
            clearTimeout(this.animationId);
            this.animationId = null;
        }
    }
}

document.addEventListener('DOMContentLoaded', () => {
