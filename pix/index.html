<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>512x512</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        img {transform: scale(4) translateX(-48px); image-rendering: pixelated; 
            image-rendering: crisp-edges; 
            display: block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
</head>
<body>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const INTERNAL_RES = 64;
        const DISPLAY_SIZE = 512;
        const FRUSTUM_SIZE = 2.5;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.OrthographicCamera(
            -FRUSTUM_SIZE / 2,
            FRUSTUM_SIZE / 2,
            FRUSTUM_SIZE / 2,
            -FRUSTUM_SIZE / 2,
            0.1,
            100
        );
        
        // Initial camera setup at (0, 5, 5)
        camera.position.set(0, 5, 5);
        camera.lookAt(0, 0, 0);

        const CONFIG = {
            HEIGHT_OFFSET: 0.2,
            WALK_SPEED: 3
        };
        const JOYSTICK_MAX_SPEED = 0.1;
        
        let posX = 0, posZ = 0;
        let vx = 0, vz = 0;
        let rotation = 0;
        let force = 0;
        let currentSpeed = CONFIG.WALK_SPEED;
        let currentRotation = 0;
        const rotationSmoothing = 0.8;
        
        let joystick = null;
        let moving = false;
        
        const keys = {
            left: false,
            right: false,
            up: false,
            down: false
        };

        const renderer = new THREE.WebGLRenderer({
            antialias: false,
            alpha: false
        });
        
        renderer.setSize(INTERNAL_RES, INTERNAL_RES, false);
        renderer.setPixelRatio(1);
        
        renderer.domElement.style.width = DISPLAY_SIZE + 'px';
        renderer.domElement.style.height = DISPLAY_SIZE + 'px';
        
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap;

        document.body.appendChild(renderer.domElement);

        const gtexture = new THREE.TextureLoader().load('grid.png');
        gtexture.magFilter = THREE.NearestFilter;
        gtexture.minFilter = THREE.NearestFilter;
        gtexture.wrapS = THREE.RepeatWrapping;
        gtexture.wrapT = THREE.RepeatWrapping;
        gtexture.repeat.set(10, 10); 

        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMaterial = new THREE.MeshLambertMaterial({ 
            color: 0x777777,
            map: gtexture 
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.rotation.z = Math.PI / 3;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);

        const facetexture = new THREE.TextureLoader().load('man.png');
        facetexture.magFilter = THREE.NearestFilter;
        facetexture.minFilter = THREE.NearestFilter;
        const geometry =  new THREE.PlaneGeometry( CONFIG.HEIGHT_OFFSET*2, CONFIG.HEIGHT_OFFSET*2);
        // const geometry = new THREE.BoxGeometry(0.6, 0.6, 0.6);
        const material = new THREE.MeshLambertMaterial({ 
            map: facetexture,
            alphaTest:0.5 
        });
        const cube = new THREE.Mesh(geometry, material);
        cube.position.set(posX, CONFIG.HEIGHT_OFFSET, posZ);
        cube.castShadow = true;
        // cube.rotation.y = -Math.PI;
        scene.add(cube);

        // --- outline ------------------------------------------------------------
        const outlineGeometry = geometry.clone();
        {
            const pos = outlineGeometry.attributes.position;
            const nor = outlineGeometry.attributes.normal;
            const v = new THREE.Vector3();
            for (let i = 0; i < pos.count; i++) {
                v.fromBufferAttribute(pos, i).normalize();
                nor.setXYZ(i, v.x, v.y, v.z);
            }
            nor.needsUpdate = true;
        }

        const outlineMaterial = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: {
                thickness:  { value: 1.0 },                                        // in internal pixels
                resolution: { value: new THREE.Vector2(INTERNAL_RES, INTERNAL_RES) }
            },
            vertexShader: /* glsl */`
                uniform float thickness;
                uniform vec2  resolution;

                void main() {
                    vec4 clipPos    = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    vec3 clipNormal = (projectionMatrix * modelViewMatrix * vec4(normal, 0.0)).xyz;

                    // projected normal direction in screen space
                    vec2 dir = clipNormal.xy;
                    float len = length(dir);
                    dir = len > 1e-6 ? dir / len : vec2(0.0);

                    // 1 internal pixel = 2.0 / resolution in NDC; * clipPos.w keeps it
                    // constant if you ever switch to a perspective camera.
                    clipPos.xy += dir * thickness * (2.0 / resolution) * clipPos.w;

                    gl_Position = clipPos;
                }
            `,
            fragmentShader: /* glsl */`
                void main() { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); }
            `
        });

        const outline = new THREE.Mesh(outlineGeometry, outlineMaterial);
        outline.castShadow = false;
        outline.receiveShadow = false;
        cube.add(outline);
        // ------------------------------------------------------------------------

        scene.add(new THREE.AmbientLight(0xffffff, 3));

        const pointLight = new THREE.PointLight(0xffffff, 6);
        pointLight.position.set(20, 20, 20);
        scene.add(pointLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(-5, 20, -5);
        directionalLight.castShadow = true;
        
        directionalLight.shadow.camera.left = -5;
        directionalLight.shadow.camera.right = 5;
        directionalLight.shadow.camera.top = 5;
        directionalLight.shadow.camera.bottom = -5;
        directionalLight.shadow.camera.near = 1;
        directionalLight.shadow.camera.far = 50;
        
        directionalLight.shadow.mapSize.width = 128;
        directionalLight.shadow.mapSize.height = 128;
        
        scene.add(directionalLight);
        scene.add(directionalLight.target);

        function limitVelocity(vx, vz, max) {
            const len = Math.hypot(vx, vz);
            if (!len) return { vx: 0, vz: 0 };
            const scale = Math.min(len, max) / len;
            return { vx: vx * scale, vz: vz * scale };
        }

        function processJoystick(data) {
            if (!data.force || data.force < 0.1) return;
            force = data.force;
            
            const newVx = data.force * Math.cos(data.angle.radian) * currentSpeed;
            const newVz = -data.force * Math.sin(data.angle.radian) * currentSpeed;
            
            const limited = limitVelocity(newVx, newVz, JOYSTICK_MAX_SPEED);
            vx = limited.vx;
            vz = limited.vz;
            moving = true;
            
            // rotation = Math.atan2(vz, vx) - Math.PI / 2;
        }

        function processKeyboard() {
            let dx = 0, dz = 0;
            if (keys.left) dx = -1;
            if (keys.right) dx = 1;
            if (keys.up) dz = -1;
            if (keys.down) dz = 1;
            
            if (dx !== 0 || dz !== 0) {
                const len = Math.hypot(dx, dz);
                const normDx = dx / len;
                const normDz = dz / len;
                const newVx = normDx * currentSpeed;
                const newVz = normDz * currentSpeed;
                const limited = limitVelocity(newVx, newVz, JOYSTICK_MAX_SPEED);
                vx = limited.vx;
                vz = limited.vz;
                moving = true;
                force = 1;
                rotation = Math.atan2(vz, vx) - Math.PI / 2;
            } else if (!joystick) {
                moving = false;
                vx = 0;
                vz = 0;
                force = 0;
            }
        }

        function update(delta) {
            if (!joystick) {
                processKeyboard();
            }
            
            if (moving && force > 0.2) {
                posX += vx * delta * 10;
                posZ += vz * delta * 10;
                
                cube.position.x = posX;
                cube.position.z = posZ;
                
                const targetRotation = -rotation;
                let diff = targetRotation - currentRotation;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                currentRotation += diff * rotationSmoothing;
                cube.rotation.y = currentRotation;
                
                return { isMoving: true };
            } else {
                return { isMoving: false };
            }
        }

        if (typeof nipplejs !== 'undefined') {
            joystick = nipplejs.create({
                dataOnly: true
            });
            
            joystick.on('move', (evt, data) => {
                processJoystick(data);
            });
            
            joystick.on('end', () => {
                moving = false;
                vx = 0;
                vz = 0;
                force = 0;
            });
        }

        window.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft': case 'a': keys.left = true; e.preventDefault(); break;
                case 'ArrowRight': case 'd': keys.right = true; e.preventDefault(); break;
                case 'ArrowUp': case 'w': keys.up = true; e.preventDefault(); break;
                case 'ArrowDown': case 's': keys.down = true; e.preventDefault(); break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowLeft': case 'a': keys.left = false; e.preventDefault(); break;
                case 'ArrowRight': case 'd': keys.right = false; e.preventDefault(); break;
                case 'ArrowUp': case 'w': keys.up = false; e.preventDefault(); break;
                case 'ArrowDown': case 's': keys.down = false; e.preventDefault(); break;
            }
        });

        const clock = new THREE.Clock();

        (function loop() {
            requestAnimationFrame(loop);
            
            const delta = clock.getDelta();
            update(delta);

            // Camera follows the cube with the specific (0, 5, 5) offset
            const cameraOffset = new THREE.Vector3(0, 5, 5);
            camera.position.copy(cube.position).add(cameraOffset);
            
            // Look directly at the cube to keep it centered
            camera.lookAt(cube.position);

            directionalLight.position.set(cube.position.x - 5, 20, cube.position.z - 5);
            directionalLight.target.position.copy(cube.position);
            directionalLight.target.updateMatrixWorld();

            renderer.render(scene, camera);
        })();
    </script>
</body>
</html>
