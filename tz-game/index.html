function SquareEase(a,b,t) {
  var s = t*t;
  return a*(1-s)+b*s;
}


// randomise
function randomFloat(a, b){
  var r =  (Math.random() * (b - a) + a);
  return r;
}

// make single star
function Star(material, x, y, size){
  this.size = size;

  this.obj = new THREE.Geometry();
  this.obj.vertices.push(new THREE.Vector3(0, 0, 0));
  this.obj.vertices.push(new THREE.Vector3(0, 0, -size));
  this.obj = new THREE.Line(this.obj, material);

  this.speed = randomFloat(1, 20);

  this.refresh = function(x, y){
    this.obj.position.z = randomFloat(0, -1000);
    this.obj.position.x = x;
    this.obj.position.y = y;
  }
  this.refresh(x, y);
}

// make/update star field
function Starfield(size, width, height){
  this.stars = [];
  this.obj = new THREE.Group();
  this.obj.rotation.x = -Math.PI/2;
  this.size = size;
  this.width = width;
  this.height = height;
  this.material = new THREE.LineBasicMaterial({color: 0xffffff});
  this.init = function(){
    for(var i = 0; i < this.size; i++){
      this.stars.push(new Star(this.material, randomFloat(-this.width, this.width), randomFloat(-this.width, this.width), randomFloat(5, 100)));
      this.obj.add(this.stars[i].obj);
    }
    stargroup.add(this.obj);
  }
  this.init();
  this.update = function(){
    if (!stopwarp) {
      for(var i = 0; i < this.size; i++){
        if(this.stars[i].obj.position.z > 50){
          this.stars[i].refresh(randomFloat(-this.width, this.width), randomFloat(-this.width, this.width));
        }
        this.stars[i].obj.position.z += this.stars[i].speed;
      } 
}//if not stopwarp



}// update
}

function sndstop () {

function sndplay () {
  audioCtx = new(window.AudioContext || window.webkitAudioContext)();
  source = audioCtx.createBufferSource();
  getData();
  source.start(0);

// play
left_osc = cntx.createOscillator();
right_osc = cntx.createOscillator();

right_osc.connect(merger, 0, 0);
left_osc.connect(merger, 0, 1);
left_osc.start();

setTimeout(function () {
  right_osc.start();
}, 10);

setTimeout(function () {
  isPlaying = true;
}, 20);    


if (typeof right_osc != "undefined") {
  right_osc.frequency.value = 2;
  left_osc.frequency.value = 2;
}

//audio
function getData() {
  source = audioCtx.createBufferSource();
  request = new XMLHttpRequest();

  request.open('GET', 'assets/ngin.wav', true);

  request.responseType = 'arraybuffer';
  request.onload = function() {
    var audioData = request.response;

    audioCtx.decodeAudioData(audioData, function(buffer) {
      myBuffer = buffer;
      songLength = buffer.duration;
      source.buffer = myBuffer;
      source.playbackRate.value =  0.5;
      source.loop = true;

      var gainNode = audioCtx.createGain()
gainNode.gain.value = 0.2 // 10% volume
gainNode.connect(audioCtx.destination)
source.connect(gainNode)

},

function(e) {
  "Error with decoding audio data" + e.error
});

  }

  request.send();
}


function tube() {
spacetex = new THREE.TextureLoader().load( 'assets/galaxyTexture.jpg' );  


  var points = [];
  var i = 0;
  var geometry = new THREE.Geometry();
    for (i = 0; i < 3; i += 1) {
    points.push(new THREE.Vector3(0, 0, i*20));
  }
  curve = new THREE.CatmullRomCurve3(points);
  curve.type = "catmullrom";

  geometry = new THREE.Geometry();
  geometry.vertices = curve.getPoints(2);
  splineMesh = new THREE.Line(geometry, new THREE.LineBasicMaterial());

  tubeMaterial = new THREE.MeshBasicMaterial({
    side: THREE.BackSide,
    map: spacetex,
    transparent:true,
    opacity: 0.3
  });
  tubeMaterial.map.wrapS = THREE.MirroredRepeatWrapping;

  tubeGeometry = new THREE.TubeGeometry(curve, 10, 2.5, 30, false);
  tubeGeometry_o = tubeGeometry.clone();
  tubeMesh = new THREE.Mesh(tubeGeometry, tubeMaterial);
  tubeMesh.scale.set(100,100,100)
  tubeMesh.position.set(0,-3000,0)
  tubeMesh.rotation.x = -Math.PI/2;
  tubeMesh.rotation.z = Math.PI;
  backgroundgroup.add(tubeMesh);
}

  var p = ctx.getImageData(0,0,128,128).data;
  for (var y = 0, i =0 ; y < 128; y++)
      for (var x = 0; x < 128; x++, i+=4)
      {
          if (p[i+0]) //a pixel
          {
              nAlive++;
          }
      }


// message
    document.getElementById('message').innerHTML = 'red level: '+nAlive;


  if (nAlive<10) {
    new Audio("assets/shoot2.wav").play();
    document.getElementById('message').innerHTML = 'clean';
  }
}
