// SIMPLE Environment Class with Canvas-based Collision Detection
class Environment {
  constructor(scene, camera, renderer, characterObject) {
    this.scene = scene;
    this.camera = camera;
    this.renderer = renderer;
    this.characterObject = characterObject;
    
    // Movement state
    this.worldX = 0;
    this.worldZ = 0;
    this.velocity = { x: 0, z: 0 };
    this.isMoving = false;
    this.rotation = 0;
    this.force = 0;
    this.currentSpeed = CONFIG.SPEEDS.WALK;
    
    // Ground
    this.ground = null;
    this.groundTexture = null;
    
    // Hit plane (for visualizing collision map)
    this.hitPlane = null;
    this.hitPlaneVisible = false;
    
    // Collision canvases - use 256x256 to match image dimensions
    this.colCanvas = null;
    this.colCtx = null;
    this.hitCanvas = null;
    this.hitCtx = null;
    this.hitImageData = null;
    
    // Loaded images
    this.imgBase = new Image();
    this.imgTex = new Image();
    
    // Joystick
    this.joystick = null;
    this.joystickContainer = null;
    
    // Player position marker (for debugging)
    this.prevPlayerCanvasX = 128; // Center of 256x256
    this.prevPlayerCanvasZ = 128;
    
    // World group (everything except character)
    this.worldGroup = new THREE.Group();
    this.scene.add(this.worldGroup);
    
    // Set character at ground level
    if (this.characterObject) {
      this.characterObject.position.y = 0;
    }
    
    this.init();
  }
  
  async init() {
    await this.setupCollisionCanvases();
    this.setupGround();
    this.setupHitPlane();
    this.setupJoystick();
    // console.log("Environment initialized with canvas collision");
  }
  
  async setupCollisionCanvases() {
    // Create offscreen canvases for collision detection - 256x256 to match image
    const canvasSize = 256; // Use 256 to match PNG dimensions
    
    // Color canvas (visual debug)
    this.colCanvas = document.createElement('canvas');
    this.colCanvas.id = 'colCanvas';
    this.colCanvas.width = canvasSize;
    this.colCanvas.height = canvasSize;
    // Move offscreen
    this.colCanvas.style.top = '-2000px';
    this.colCanvas.style.left = '-2000px';
    this.colCanvas.style.imageRendering = 'pixelated'; // Pixel perfect
    this.colCanvas.style.imageRendering = 'crisp-edges';
    document.body.appendChild(this.colCanvas);
    this.colCtx = this.colCanvas.getContext('2d');
    
    // Hit canvas (collision data - black/white) - NO ANTIALIASING
    this.hitCanvas = document.createElement('canvas');
    this.hitCanvas.id = 'hitCanvas';
    this.hitCanvas.width = canvasSize;
    this.hitCanvas.height = canvasSize;
    // Move offscreen
    this.hitCanvas.style.top = '-2000px';
    this.hitCanvas.style.left = '-2000px';
    this.hitCanvas.style.imageRendering = 'pixelated'; // Pixel perfect
    this.hitCanvas.style.imageRendering = 'crisp-edges';
    document.body.appendChild(this.hitCanvas);
    this.hitCtx = this.hitCanvas.getContext('2d', {
      willReadFrequently: true,
    });
    
    // Disable ALL antialiasing on hit canvas
    this.hitCtx.imageSmoothingEnabled = false;
    this.hitCtx.mozImageSmoothingEnabled = false;
    this.hitCtx.webkitImageSmoothingEnabled = false;
    this.hitCtx.msImageSmoothingEnabled = false;
    this.hitCtx.oImageSmoothingEnabled = false;
    
    // Initialize hit canvas with white (walkable) background
    this.hitCtx.fillStyle = '#ffffff';
    this.hitCtx.fillRect(0, 0, canvasSize, canvasSize);

    
    // Initialize hitImageData with white image data
    this.hitImageData = this.hitCtx.getImageData(0, 0, canvasSize, canvasSize);
    
    // Load PNG files for collision maps
    try {
      await Promise.all([
        loadImg(this.imgBase, '3d/lvl-collision.png', () => {
          // Draw without ANY smoothing - pixel perfect
          this.hitCtx.save();
          this.hitCtx.imageSmoothingEnabled = false;
          this.hitCtx.mozImageSmoothingEnabled = false;
          this.hitCtx.webkitImageSmoothingEnabled = false;
          this.hitCtx.msImageSmoothingEnabled = false;
          
          // Clear to white first
          this.hitCtx.fillStyle = '#ffffff';
          this.hitCtx.fillRect(0, 0, canvasSize, canvasSize);
          
          // Draw image at exact size
          this.hitCtx.drawImage(this.imgBase, 0, 0, canvasSize, canvasSize);
          this.hitCtx.restore();
          // console.log('Loaded hit canvas PNG (256x256)');
          
          // Update hitImageData after image loads
          this.hitImageData = this.hitCtx.getImageData(0, 0, canvasSize, canvasSize);
        }),
        loadImg(this.imgTex, '3d/lvl-colour.png', () => {
          this.colCtx.imageSmoothingEnabled = false;
          this.colCtx.drawImage(this.imgTex, 0, 0, canvasSize, canvasSize);
          // console.log('Loaded color canvas PNG (256x256)');
        })
      ]);
    } catch (err) {
      console.error('Failed to load collision PNG files:', err);
    }
  }
  
  setupGround() {
    // Create ground plane
    const geometry = new THREE.PlaneGeometry(CONFIG.GROUND_SIZE, CONFIG.GROUND_SIZE, 256, 256);
    
    // Load ground texture
    const heightscale = 2;
    const textureLoader = new THREE.TextureLoader();
    this.groundTexture = textureLoader.load('3d/lvl-colour.png');
    this.groundTexture.magFilter = this.groundTexture.minFilter = THREE.NearestFilter;
    
    const groundMaterial = new THREE.MeshStandardMaterial({
      shininess: 0,
      map: this.groundTexture,
      displacementMap: new THREE.TextureLoader().load("3d/lvl-bump.png"),
      displacementScale: heightscale,
      // displacementBias: 5,
      metalness: 0.01,
      roughness: 0.9,
      side: THREE.DoubleSide
    });
    
    this.ground = new THREE.Mesh(geometry, groundMaterial);
    this.ground.rotation.x = -Math.PI / 2;
    this.ground.position.y = -0.09-(heightscale/2);
    this.ground.receiveShadow = true;
    this.ground.castShadow = true;
    this.worldGroup.add(this.ground);
  }
  
  setupHitPlane() {
    // Create a plane that displays the hitCanvas texture
    const geometry = new THREE.PlaneGeometry(CONFIG.GROUND_SIZE, CONFIG.GROUND_SIZE, 1, 1);
    
    // Create texture from hitCanvas - disable antialiasing
    const hitTexture = new THREE.CanvasTexture(this.hitCanvas);
    hitTexture.magFilter = THREE.NearestFilter; // Pixel perfect
    hitTexture.minFilter = THREE.NearestFilter; // Pixel perfect
    hitTexture.generateMipmaps = false; // Disable mipmaps
    hitTexture.anisotropy = 0; // No anisotropy
    hitTexture.wrapS = THREE.ClampToEdgeWrapping;
    hitTexture.wrapT = THREE.ClampToEdgeWrapping;
    
    const hitMaterial = new THREE.MeshBasicMaterial({
      map: hitTexture,
      // transparent: true,
      // opacity: 0.7,
      side: THREE.DoubleSide
    });
    
    this.hitPlane = new THREE.Mesh(geometry, hitMaterial);
    this.hitPlane.rotation.x = -Math.PI / 2;
    // Position at character's feet level
    this.hitPlane.position.y = 0.05;
    this.hitPlane.visible = this.hitPlaneVisible;
    
    this.worldGroup.add(this.hitPlane);
    
   
  }
  
  toggleHitPlane() {
    this.hitPlaneVisible = !this.hitPlaneVisible;
    if (this.hitPlane) {
      this.hitPlane.visible = this.hitPlaneVisible;
      
      if (this.hitPlaneVisible && this.hitPlane.material.map) {
        this.hitPlane.material.map.needsUpdate = true;
      }
    }
    return this.hitPlaneVisible;
  }
  
  setupJoystick() {
    this.joystickContainer = document.createElement('div');
    this.joystickContainer.id = 'joystickContainer';
    document.body.appendChild(this.joystickContainer);
    
    if (typeof nipplejs !== 'undefined') {
      this.joystick = nipplejs.create({
        dataOnly: true,
      });
      
      this.joystick.on('move', (evt, data) => {
        if (!data.force || data.force < 0.1) return;
        this.force = data.force;

        const angle = data.angle.radian;
        const force = Math.min(data.force, 1.5);
        
        // FIX: Remove negative sign from X, keep Z as-is
        this.velocity.x = Math.cos(angle) * force * this.currentSpeed;
        this.velocity.z = Math.sin(-angle) * force * this.currentSpeed;
        
        this.rotation = Math.atan2(this.velocity.z, -this.velocity.x) - Math.PI / 2;
        
        this.isMoving = true;
      });
      
      this.joystick.on('end', () => {
        this.velocity.x = 0;
        this.velocity.z = 0;
        this.isMoving = false;
      });
    }
  }
  
  clearPlayerMarker() {
    const canvasSize = 256;
    
    // Check if hitImageData exists
    if (!this.hitImageData || !this.hitImageData.data) {
      return;
    }
    
    // Clear previous red square
    if (this.prevPlayerCanvasX >= 0 && this.prevPlayerCanvasX < canvasSize && 
        this.prevPlayerCanvasZ >= 0 && this.prevPlayerCanvasZ < canvasSize) {
      
      // Get the original pixel from hitImageData
      const index = (this.prevPlayerCanvasZ * canvasSize + this.prevPlayerCanvasX) * 4;
      const red = this.hitImageData.data[index];
      const green = this.hitImageData.data[index + 1];
      const blue = this.hitImageData.data[index + 2];
      
      // Restore original color on hit canvas
      this.hitCtx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
      this.hitCtx.fillRect(this.prevPlayerCanvasX - 1, this.prevPlayerCanvasZ - 1, 2, 2);
    }
  }
  
  updatePlayerMarker() {
    const canvasSize = 256; // Match image dimensions
    const center = canvasSize / 2;
    // Scale from world coordinates (200 units) to canvas (256 pixels)
    const scale = canvasSize / CONFIG.GROUND_SIZE;
    
    // Convert world position to canvas position
    const canvasX = Math.floor(center + this.worldX * scale);
    const canvasZ = Math.floor(center + this.worldZ * scale);
    
    // Clear previous red square only if hitImageData exists
    if (this.hitImageData && this.hitImageData.data) {
      this.clearPlayerMarker();
    }
    
    // Draw new red square (pixel perfect, no anti-aliasing)
    this.hitCtx.fillStyle = '#ff0000';
    this.hitCtx.fillRect(canvasX - 1, canvasZ - 1, 2, 2);
    
    // Update hit plane texture
    if (this.hitPlane && this.hitPlane.material.map) {
      this.hitPlane.material.map.needsUpdate = true;
    }
    
    // Store for next frame
    this.prevPlayerCanvasX = canvasX;
    this.prevPlayerCanvasZ = canvasZ;
    
    // Debug output (optional)
    // console.log(`Player: world(${this.worldX.toFixed(2)}, ${this.worldZ.toFixed(2)}) -> canvas(${canvasX}, ${canvasZ})`);
  }
  
  checkCollision(proposedX, proposedZ) {
    const canvasSize = 256;
    const center = canvasSize / 2;
    const scale = canvasSize / CONFIG.GROUND_SIZE;
    
    // Convert world position to canvas position
    const canvasX = Math.floor(center + proposedX * scale);
    const canvasZ = Math.floor(center + proposedZ * scale);
    
    // Check bounds
    if (canvasX < 0 || canvasX >= canvasSize || canvasZ < 0 || canvasZ >= canvasSize) {
      return true;
    }
    
    // Check if hitImageData exists
    if (!this.hitImageData || !this.hitImageData.data) {
      console.warn("hitImageData not loaded yet");
      return false; // Allow movement until collision data loads
    }
    
    // Get pixel data from the original hitImageData
    const index = (canvasZ * canvasSize + canvasX) * 4;
    const red = this.hitImageData.data[index];
    
    // If pixel is black (0) or dark (below threshold), it's a collision
    const collision = red < CONFIG.COLLISION_THRESHOLD;    
    return collision;
  }
  
  setSpeedForState(state) {
    switch(state) {
      case 'walk':
        this.currentSpeed = CONFIG.SPEEDS.WALK;
        break;
      case 'run':
        this.currentSpeed = CONFIG.SPEEDS.RUN;
        break;
      default:
        this.currentSpeed = CONFIG.SPEEDS.WALK;
    }
  }
  
  limitVelocity(vx, vz, maxSpeed) {
    const hyp = Math.hypot(vx, vz);
    if (hyp === 0) return { vx: 0, vz: 0 };
    const limitedSpeed = Math.min(hyp, maxSpeed);
    const ratio = limitedSpeed / hyp;
    return {
      vx: ratio * vx,
      vz: ratio * vz
    };
  }
  
  update(delta) {
    if (this.isMoving && this.force > 0.2) {
      const maxSpeed = this.currentSpeed;
      const limited = this.limitVelocity(this.velocity.x, this.velocity.z, maxSpeed);
      this.velocity.x = limited.vx;
      this.velocity.z = limited.vz;
      
      const proposedX = this.worldX + this.velocity.x * delta;
      const proposedZ = this.worldZ + this.velocity.z * delta;
      
      const collision = this.checkCollision(proposedX, proposedZ);
      
      if (!collision) {
        this.worldX = proposedX;
        this.worldZ = proposedZ;
        
        // Update world group position to move environment around character
        this.worldGroup.position.x = -this.worldX;
        this.worldGroup.position.z = -this.worldZ;
      } else {
        this.velocity.x = 0;
        this.velocity.z = 0;
        this.isMoving = false;
        // bumpSFX();
      }
      
      if (this.characterObject) {
        this.characterObject.rotation.y = this.rotation;
      }
    }
    
    // Always update player marker
    this.updatePlayerMarker();
    
    const speed = Math.sqrt(this.velocity.x * this.velocity.x + this.velocity.z * this.velocity.z);
    
    return {
      isMoving: this.isMoving && speed > 0,
      speed: speed,
      position: { x: this.worldX, z: this.worldZ },
      collision: false
    };
  }
  
  dispose() {
    if (this.joystick) {
      this.joystick.destroy();
    }
    
    if (this.joystickContainer && this.joystickContainer.parentNode) {
      this.joystickContainer.parentNode.removeChild(this.joystickContainer);
    }
  }
} // <-- CLOSING BRACE FOR ENVIRONMENT CLASS



    // Face Manager Class
    class FaceManager {
      constructor() {
        this.textures = {};
        this.currentFace = "0";
        this.isReady = false;
        this.textureLoader = new THREE.TextureLoader();
        this.faces = [
          { n: "0", col: "3d/sm-face.png", bump: "3d/sm-facebmp.png" },
          { n: "1", col: "3d/sm-face.png", bump: "3d/sm-facebmp.png" },
          { n: "2", col: "3d/sm-faceblink.png", bump: "3d/sm-facebmp.png" },
          { n: "3", col: "3d/sm-face-A.png", bump: "3d/sm-facebmp-A.png" },
          { n: "4", col: "3d/sm-face-aaa.png", bump: "3d/sm-facebmp-aaa.png" },
          { n: "5", col: "3d/sm-face-E.png", bump: "3d/sm-facebmp-E.png" },
          { n: "6", col: "3d/sm-face-L.png", bump: "3d/sm-facebmp-L.png" },
          { n: "7", col: "3d/sm-face-oo.png", bump: "3d/sm-facebmp-oo.png" },
          { n: "8", col: "3d/sm-face-M.png", bump: "3d/sm-facebmp-M.png" },
          { n: "9", col: "3d/sm-face-F.png", bump: "3d/sm-facebmp-F.png" }
        ];
      }

      async init() {
        await this.preloadTextures();
        this.isReady = true;
        if (document.getElementById("loading")) {
          document.getElementById("loading").style.display = "none";
        }
      }

      async preloadTextures() {
        const loadPromises = this.faces.map(async (face) => {
          const [col, bump] = await Promise.all([
            this.loadTexture(face.col),
            this.loadTexture(face.bump)
          ]);
          this.texfix(col);
          this.texfix(bump);
          return { n: face.n, col, bump };
        });

        const loaded = await Promise.all(loadPromises);
        loaded.forEach((texture) => {
          this.textures[texture.n] = texture;
        });
      }

      loadTexture(url) {
        return new Promise((resolve, reject) => {
          this.textureLoader.load(url, resolve, undefined, reject);
        });
      }

      texfix(texture) {
        texture.magFilter = texture.minFilter = THREE.NearestFilter;
      }

      setFace(faceIndex) {
        if (!this.isReady || !window.headMaterial) return;

        const face = this.textures[faceIndex];
        if (face && this.currentFace !== faceIndex) {
          window.headMaterial.map = face.col;
          window.headMaterial.displacementMap = face.bump;
          window.headMaterial.needsUpdate = true;
          this.currentFace = faceIndex;
        }
      }
    }

    // Footstep Manager Class
    class FootstepManager {
      constructor(animationMixer) {
        this.mixer = animationMixer;
        this.currentState = '';
        this.stepSounds = {
          walk: stepSFX,
          run: stepSFX
        };
        
        this.lastAnimationTime = 0;
        this.stepCounter = 0;
        this.stepPatterns = {
          walk: { intervals: [0.4, 0.9], threshold: 0.1, lastPlayed: {} },
          run: { intervals: [0.4, 0.9], threshold: 0.1, lastPlayed: {} }
        };
      }
      
      setState(state, animationAction) {
        this.currentState = state;
        
        if (this.stepPatterns[state]) {
          Object.keys(this.stepPatterns[state].lastPlayed).forEach(key => {
            this.stepPatterns[state].lastPlayed[key] = false;
          });
        }
      }
      
      update(delta, animationAction) {
        if (!animationAction || !this.stepPatterns[this.currentState]) return;
        
        const currentTime = animationAction.time;
        const clipDuration = animationAction.getClip().duration;
        const normalizedTime = (currentTime % clipDuration) / clipDuration;
        
        this.playStepFromAnimation(normalizedTime);
        this.lastAnimationTime = currentTime;
      }
      
      playStepFromAnimation(normalizedTime) {
        const pattern = this.stepPatterns[this.currentState];
        if (!pattern) return;
        
        for (const interval of pattern.intervals) {
          const lowerBound = interval - pattern.threshold;
          const upperBound = interval + pattern.threshold;
          
          if (normalizedTime >= lowerBound && normalizedTime <= upperBound) {
            if (!pattern.lastPlayed[interval]) {
              this.playStep();
              pattern.lastPlayed[interval] = true;
            }
          } else {
            pattern.lastPlayed[interval] = false;
          }
        }
      }
      
      playStep() {
        if (this.stepSounds[this.currentState]) {
          this.stepSounds[this.currentState]();
          this.stepCounter++;
        }
      }
    }

    // Application main class
    class Shabooboo {
      constructor() {
        this.state = 'sit';
        this.environment = null;
        this.scene = null;
        this.camera = null;
        this.renderer = null;
        this.clock = null;
        this.mixer = null;
        this.actions = [];
        this.currentAction = null;
        this.num = 0;
        this.earGroup = null;
        this.ear1 = null;
        this.ear2 = null;
        this.characterObject = null;
        
        // Inactivity timer for auto-sit
        this.inactivityTimer = 0;
        this.lastMovementTime = 0;
        
        // Speech synthesis
        this.synth = window.speechSynthesis;
        this.isSpeaking = false;
        this.speechTimeout = null;
        
        // Bone references
        this.bones = {
          head: null
        };
        
        // Texture cache
        this.textures = {};
        
        // Face manager
        this.faceManager = new FaceManager();
        
        // Footstep manager
        this.footstepManager = null;
        
        this.init();
      }
      
      async init() {
        this.setupScene();
        this.setupCamera();
        this.setupRenderer();
        this.setupLights();
        this.setupUI();
        await this.loadCharacter();
        this.setupEventListeners();
        this.startAnimationLoop();
      }
      
      setupScene() {
        this.scene = new THREE.Scene();
        this.clock = new THREE.Clock();
      }
      
      setupCamera() {
        this.camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        this.camera.position.set(0, 1, 5);
        this.camera.lookAt(0, 0, 0);
        this.scene.add(this.camera);
      }
      
      setupRenderer() {
        this.renderer = new THREE.WebGLRenderer({
          alpha: true,
          antialias: true
        });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.shadowMap.enabled = true;
        document.body.appendChild(this.renderer.domElement);
      }
      
      setupLights() {
  const ambient = new THREE.AmbientLight(0xcccccc, 0.8);
  this.scene.add(ambient);
  
  // Main directional light for shadows
  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(30, 50, 30);
  dirLight.castShadow = true;
  
  // Configure shadow camera (like a camera that sees what the light sees)
  dirLight.shadow.camera.left = -100;
  dirLight.shadow.camera.right = 100;
  dirLight.shadow.camera.top = 100;
  dirLight.shadow.camera.bottom = -100;
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 200;
  
  // Shadow map resolution - higher = better quality but slower
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  
  // Shadow properties
  // dirLight.shadow.radius = 3; // Soft shadow blur
  dirLight.shadow.bias = -0.0001; // Adjust to fix shadow acne
  
  this.scene.add(dirLight);
  
  // Optional: Add helper to visualize the shadow camera
  // const shadowHelper = new THREE.CameraHelper(dirLight.shadow.camera);
  // this.scene.add(shadowHelper);
  
  // Fill light (no shadow)
  const fillLight = new THREE.PointLight(0xffefef, 0.5);
  fillLight.position.set(-30, 20, -30);
  this.scene.add(fillLight);
}
      
      setupUI() {
        const loading = document.createElement('div');
        loading.id = 'loading';
        loading.textContent = 'Loading...';
        document.body.appendChild(loading);
        
        const shabubuBtn = document.createElement('button');
        shabubuBtn.id = 'shabubuBtn';
        shabubuBtn.textContent = 'SHABUBU';
        shabubuBtn.addEventListener('click', () => this.speakContent('shabubu'));
        shabubuBtn.addEventListener('touchend', (e) => {
          e.preventDefault();
          this.speakContent('shabubu');
        });
        document.body.appendChild(shabubuBtn);
        
        const debugBtn = document.createElement('button');
        debugBtn.id = 'debugBtn';
        debugBtn.textContent = 'SHOW HIT MAP';
        debugBtn.addEventListener('click', () => {
          const isVisible = this.environment.toggleHitPlane();
          debugBtn.textContent = isVisible ? 'HIDE HIT MAP' : 'SHOW HIT MAP';
          debugBtn.style.background = isVisible ? '#ff0000' : '#00ff00';
        });
        document.body.appendChild(debugBtn);
      }
      
      getTexture(path) {
        if (!this.textures[path]) {
          const texture = new THREE.TextureLoader().load(path);
          texture.magFilter = THREE.NearestFilter;
          texture.minFilter = THREE.NearestFilter;
          this.textures[path] = texture;
        }
        return this.textures[path];
      }
      
      async loadCharacter() {
        const loader = new THREE.FBXLoader();
        
        return new Promise((resolve, reject) => {
          loader.load('3d/tpose.fbx', (object) => {
            this.characterObject = object;
            this.mixer = new THREE.AnimationMixer(object);
            this.cacheBoneReferences(object);
            
            const tPoseAction = this.mixer.clipAction(object.animations[0]);
            this.actions[CONFIG.ANIMATIONS.T_POSE] = tPoseAction;
            
            this.loadSittingPose().then(resolve);
          }, undefined, (error) => {
            console.error('Error loading character:', error);
            reject(error);
          });
        });
      }
      
      cacheBoneReferences(object) {
        this.bones.head = object.getObjectByName('mixamorigHead');
      }
      
      async loadSittingPose() {
        const loader = new THREE.FBXLoader();
        
        return new Promise((resolve, reject) => {
          loader.load('3d/sit.fbx', (object) => {
            const sitAction = this.mixer.clipAction(object.animations[0]);
            this.actions[CONFIG.ANIMATIONS.SIT] = sitAction;
            this.loadOtherAnimations().then(resolve);
          }, undefined, reject);
        });
      }
      
      async loadOtherAnimations() {
        const animFiles = [
          { file: 'idle.fbx', index: CONFIG.ANIMATIONS.IDLE },
          { file: 'walk.fbx', index: CONFIG.ANIMATIONS.WALK },
          { file: 'run.fbx', index: CONFIG.ANIMATIONS.RUN }
        ];
        
        const loader = new THREE.FBXLoader();
        const promises = animFiles.map(({ file, index }) => {
          return new Promise((resolve, reject) => {
            loader.load(`3d/${file}`, (object) => {
              const action = this.mixer.clipAction(object.animations[0]);
              this.actions[index] = action;
              resolve();
            }, undefined, reject);
          });
        });
        
        await Promise.all(promises);
        this.finalizeCharacterSetup();
      }
      
      async finalizeCharacterSetup() {
        this.setupMaterials();
        this.scene.add(this.characterObject);
        this.setupCharacterParts();
        
        await this.faceManager.init();
        this.footstepManager = new FootstepManager(this.mixer);
        
        // Initialize environment - this loads the PNG files
        this.environment = new Environment(
          this.scene,
          this.camera,
          this.renderer,
          this.characterObject
        );
        
        // Wait for environment to initialize
        await this.environment.init();
        
        this.playAction(CONFIG.ANIMATIONS.SIT);
      }
      
      setupMaterials() {
        if (!this.characterObject) return;
        
        const bodyTexture = this.getTexture('3d/shabody.png');
        
        this.characterObject.traverse(child => {
          if (child.isMesh && child.material) {
            child.material.shininess = 0;
            child.material.map = bodyTexture;
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
      }
      
      setupCharacterParts() {
        if (!this.bones.head) return;
        
        const sphereGeometry = new THREE.SphereGeometry(0.7, 40, 40);
        const sphereMaterial = new THREE.MeshStandardMaterial({
          metalness: 0.01,
          roughness: 3,
          map: this.getTexture('3d/sm-face.png'),
          displacementMap: this.getTexture('3d/sm-facebmp.png'),
          roughnessMap: this.getTexture('3d/sm-facerough.png'),
          displacementScale: -0.4
        });
        
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.scale.set(0.7, 0.7, 0.8);
        sphere.rotation.y = -Math.PI / 2;
        sphere.position.set(0, 0.3, 0.1);
        sphere.receiveShadow = true;
        sphere.castShadow = true;
        this.bones.head.add(sphere);
        
        window.headMaterial = sphereMaterial;
        this.setupEars();
      }
      
      setupEars() {
        this.earGroup = new THREE.Group();
        this.earGroup.rotation.y = Math.PI * 2;
        this.bones.head.add(this.earGroup);
        
        const earGeometry = new THREE.SphereGeometry(0.15, 30, 30);
        const earMaterial = new THREE.MeshStandardMaterial({
          metalness: 0.01,
          roughness: 3,
          map: this.getTexture('3d/eartex.png'),
          displacementMap: this.getTexture('3d/bmp.png'),
          displacementScale: -0.1
        });
        
        const createEar = (xPos, rotationY) => {
          const earGroup = new THREE.Group();
          earGroup.position.set(xPos, 0.6, 0);
          earGroup.rotation.set(Math.PI, -Math.PI / 2, 0);
          earGroup.scale.set(0.6, 1.5, 1);
          
          const earMesh = new THREE.Mesh(earGeometry, earMaterial);
          earMesh.position.set(0, 0.1, 0);
          earMesh.scale.y = 1.2;
          earMesh.rotation.y = rotationY;
          earGroup.add(earMesh);
          earMesh.castShadow = true;
          
          return earGroup;
        };
        
        this.ear1 = createEar(-0.2, 0.3);
        this.ear2 = createEar(0.2, -0.3);
        this.earGroup.add(this.ear1);
        this.earGroup.add(this.ear2);
      }
      
      playAction(index) {
        if (!this.actions[index] || this.actions[index] === this.currentAction) {
          return;
        }
        
        const newAction = this.actions[index];
        
        if (this.currentAction) {
          this.currentAction.fadeOut(0.2);
        }
        
        newAction.reset();
        newAction.setEffectiveWeight(1);
        newAction.fadeIn(0.2);
        newAction.play();
        
        this.currentAction = newAction;
        this.mixer.update(0);
        
        let stateName = '';
        switch(index) {
          case CONFIG.ANIMATIONS.WALK:
            stateName = 'walk';
            break;
          case CONFIG.ANIMATIONS.RUN:
            stateName = 'run';
            break;
          default:
            stateName = '';
        }
        
        if (this.footstepManager) {
          this.footstepManager.setState(stateName, newAction);
        }
      }
      
      blink() {
        this.faceManager.setFace("2");
        setTimeout(() => {
          if (!this.isSpeaking) {
            this.faceManager.setFace("1");
          }
        }, Math.random() * 200);
      }
      
      speakContent(text) {
        if (!this.faceManager.isReady || this.isSpeaking) return;
        
        this.isSpeaking = true;
        this.mouthshape(text);
        
        const utterThis = new SpeechSynthesisUtterance(text);
        utterThis.pitch = 1.2;
        utterThis.rate = 0.85;
        utterThis.volume = 0.5;

        const voices = speechSynthesis.getVoices();
        const tessaVoice = voices.find(voice => voice.name === "Tessa");
        if (tessaVoice) {
          utterThis.voice = tessaVoice;
        }

        this.synth.speak(utterThis);
        
        utterThis.onend = () => {
          this.isSpeaking = false;
          clearTimeout(this.speechTimeout);
          this.faceManager.setFace("1");
          this.blink();
        };
        
        utterThis.onerror = () => {
          this.isSpeaking = false;
          clearTimeout(this.speechTimeout);
          this.faceManager.setFace("1");
        };
      }
      
      mouthshape(text) {
        for (let i = 0, len = text.length; i < len; i++) {
          setTimeout(
            ((i) => {
              return () => {
                this.lipsync(text[i]);
              };
            })(i),
            70 * i
          );
        }
        
        this.speechTimeout = setTimeout(() => {
          if (this.isSpeaking) {
            this.faceManager.setFace("1");
          }
        }, 70 * text.length + 50);
      }
      
      lipsync(character) {
        const faceIndex = phonemeMap[character] || phonemeMap.default;
        this.faceManager.setFace(faceIndex);
      }
      
    //
update(delta) {
  this.num++;
  
  if (this.environment) {
    const envState = this.environment.update(delta);
    
    const isActuallyMoving = envState.isMoving && this.environment.force > 0.2;
    
    if (isActuallyMoving) {
      this.lastMovementTime = 0;
      this.inactivityTimer = 0;
      
      const joystickForce = this.environment.force;
      
      if (joystickForce > 1.0) {
        if (this.state !== 'run') {
          this.state = 'run';
          this.environment.setSpeedForState('run');
          this.playAction(CONFIG.ANIMATIONS.RUN);
        }
      } else if (joystickForce > 0.2) {
        if (this.state !== 'walk') {
          this.state = 'walk';
          this.environment.setSpeedForState('walk');
          this.playAction(CONFIG.ANIMATIONS.WALK);
        }
      }
    } else {
      this.lastMovementTime += delta;
      this.inactivityTimer += delta;
      
      if (this.inactivityTimer >= CONFIG.AUTO_SIT_TIME && this.state !== 'sit') {
        this.state = 'sit';
        this.playAction(CONFIG.ANIMATIONS.SIT);
        this.inactivityTimer = 0;
      } else if (!envState.isMoving && this.state !== 'idle' && this.state !== 'sit') {
        this.state = 'idle';
        this.playAction(CONFIG.ANIMATIONS.IDLE);
      }
    }
  }

  if (this.mixer) {
    this.mixer.update(delta);
    
    if (this.footstepManager && (this.state === 'walk' || this.state === 'run')) {
      this.footstepManager.update(delta, this.currentAction);
    }
    
    if (this.ear1 && this.ear2) {
      let rotation;
      
      if (this.isSpeaking) {
        rotation = Math.sin(this.num / 10) / 10;
      } else if (this.state === 'walk') {
        rotation = Math.sin(this.num / 10) / 10;
      } else if (this.state === 'run') {
        rotation = Math.sin(this.num / 5) / 5;
      } else {
        rotation = Math.sin(this.num / 20) / 20;
      }
      
      this.ear1.rotation.x += (rotation - this.ear1.rotation.x) * 0.3;
      this.ear2.rotation.x += (Math.cos(this.num / (this.state === 'run' ? 5 : 10)) / 10 - this.ear2.rotation.x) * 0.3;
    }
  }
  
  if (!this.isSpeaking && Math.random() > 0.99 && this.faceManager.isReady) {
    this.blink();
  }
  
  // Camera follows character with better view
  if (this.environment) {
    this.camera.position.z = this.characterObject.position.z+4;
    this.camera.position.y = 1; // Keep some height
    this.camera.lookAt(0, 0, 0);
  }
  
  this.renderer.render(this.scene, this.camera);
}
      
      startAnimationLoop() {
        const animate = (time) => {
          requestAnimationFrame(animate);
          const delta = this.clock.getDelta();
          this.update(delta);
        };
        
        animate();
      }
      
      setupEventListeners() {
        window.addEventListener('resize', () => {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        window.addEventListener('keydown', (e) => {
          if (e.key === 'd' || e.key === 'D') {
            document.body.classList.toggle('debug');
          }
        });
      }
      
      cleanup() {
        if (this.environment) {
          this.environment.dispose();
        }
      }
    }
    
    window.addEventListener('DOMContentLoaded', () => {
      new Shabooboo();
    });
  </script>
</body>
