<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FREE</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #222;
        font-family: Arial, sans-serif;
      }
      canvas {
        display: block;
      }
      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 10px;
        max-width: 300px;
      }
      #info h1 {
        margin: 0 0 10px 0;
        color: #ffcc00;
      }
      #info p {
        margin: 5px 0;
        font-size: 14px;
      }
  #hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        text-align: center;
      }
      #hud #btn {
        display: block;
        width: 50px;
        height: 50px;
        margin: 10px auto;
        outline: none;
        border: none;
        font-family: monospace;
        color: white;
        cursor: pointer;
		transform: scale(0.8);
      }
	#hud #btn svg {	  }
	#hud #btn {background-color:transparent; transition: 0.2s all ease-in-out;}
	#hud #btn.on { transform: scale(1);}
 	#hud #btn.on svg path, #hud #btn:hover svg path { stroke:#ff0000; }
	#hud #btn svg path { stroke:#fff; }
      audio {position: absolute; z-index: 99;}
</style>
  </head>
  <body>
    <div id="hud">
      <button id="btn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          xmlns:xlink="http://www.w3.org/1999/xlink"
          preserveAspectRatio="none"
          viewBox="0 0 60 60"
        >
          <path
            id="a"
            fill="none"
            stroke="#000"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="7"
            d="M30.05 13v16.7"
          />
          <path
            id="b"
            fill="none"
            stroke="#000"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="7"
            d="M41.6 16.8q.35.4.7.75 5.1 5.1 5.1 12.25t-5.1 12.25q-5.1 5-12.25 5t-12.3-5q-5.1-5.1-5.1-12.25t5.1-12.25q.4-.35.75-.75"
          />
        </svg>
      </button>
    </div>

  <!-- <audio id="sfx" src="assets/vacuum.wav" controls="false" loop></audio> -->

    <script src="js/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script>
      var xval = 0;
      var lerped = 0;
      var sfxaudio = new Audio('assets/vacuum.wav');
      sfxaudio.loop=true;


        let previousVacuumPosition = new THREE.Vector3();
        let vacuumSpeed = 0;
        let frameCount = 0;

        // click BTN
        document.getElementById("btn").addEventListener("click",bbclk, false );
        var btnpressed = false;
        //
        function bbclk() {

        if(!btnpressed){ 
            btnpressed = true;
            document.getElementById("btn").classList = 'on';
            startsfx();
            startosc();
            sfxaudio.play();
            xval = 1;
        } else {
            btnpressed = false;
            document.getElementById("btn").classList = '';
            stoposc()
            sfxaudio.pause();
            xval = 0;
        }
        }


      // Scene setup
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Position camera
      camera.position.set(0, 4, 6);
      camera.lookAt(0, 1, 0);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0x404040, 1);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(10, 10, 5);
      directionalLight.castShadow = true;
      directionalLight.shadow.mapSize.width = 512;
      directionalLight.shadow.mapSize.height = 512;
      directionalLight.shadow.camera.near = 0.5;
      directionalLight.shadow.camera.far = 25;
      directionalLight.shadow.camera.left = -10;
      directionalLight.shadow.camera.right = 10;
      directionalLight.shadow.camera.top = 10;
      directionalLight.shadow.camera.bottom = -10;
      directionalLight.shadow.radius = 2;
      scene.add(directionalLight);

      // controls
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.maxDistance = 25;
      controls.minDistance = 7;
      controls.maxPolarAngle = Math.PI * 0.48;
      controls.enablePan = false;

      // Floor/Carpet
      var groundplane = new THREE.Group();
      groundplane.position.y = -0.3;
      scene.add(groundplane);

      var wgeometry = new THREE.PlaneBufferGeometry(50, 50, 50, 50);
      // var wgeometry = new THREE.CircleGeometry( 15, 30, 30 );
      var wmaterial = new THREE.MeshStandardMaterial({
        map: new THREE.TextureLoader().load(
          "assets/Carpet012_1K-JPG_Color.jpg"
        ),
        normalMap: new THREE.TextureLoader().load(
          "assets/Carpet012_1K-JPG_NormalGL.jpg"
        ),
        roughness: 0.9,
        metalness: 0.0,
      });
      wmaterial.map.wrapS = THREE.RepeatWrapping;
      wmaterial.map.wrapT = THREE.RepeatWrapping;
      wmaterial.map.repeat.set(4, 4);
      var carpet = new THREE.Mesh(wgeometry, wmaterial);
      carpet.receiveShadow = true;
      carpet.rotation.set(-Math.PI * 0.5, 0, 0);
      carpet.position.y = 0.05;
      groundplane.add(carpet);

      // vigniette
      var vmaterial = new THREE.MeshBasicMaterial({
        map: new THREE.TextureLoader().load("assets/3frame.png"),
        transparent: true,
      });
      var frame = new THREE.Mesh(wgeometry, vmaterial);
      frame.material.map.magFilter = THREE.NearestFilter;
      frame.material.map.minFilter = THREE.NearestFilter;
      frame.rotation.set(-Math.PI * 0.5, 0, 0);
      frame.position.y = 0.055;
      frame.scale.set(1.2, 1.2, 1.2);
      groundplane.add(frame);

      // model
      bg = new THREE.Group();
      scene.add(bg);

      vacuum = new THREE.Group();
      vacuum.scale.set(0.2, 0.2, 0.2);
      // vacuum.position.set(0,-10,0);
      bg.add(vacuum);

      handle = new THREE.Group();
      handle.scale.set(0.2, 0.2, 0.2);
      // handle.position.set(-2,1.2,0);
      handle.rotation.set(Math.PI * 0.5, 0, 0);
      bg.add(handle);

      // loader
      const loader = new THREE.BufferGeometryLoader();

      // materials
      const blinktex = new THREE.TextureLoader().load("assets/henryF2.png");
      const facetex = new THREE.TextureLoader().load("assets/henryF.png");
      const ooface = new THREE.TextureLoader().load("assets/henryF3.png");

      fixtexture(blinktex);
      fixtexture(facetex);
      fixtexture(ooface);

      const facematerial = new THREE.MeshLambertMaterial({
        map: facetex,
        transparent: true,
      });

      const hmaterial = new THREE.MeshStandardMaterial({
        map: new THREE.TextureLoader().load("assets/henry2.png"),
        roughness: 0.4,
        metalness: 0.1,
      });

      const txtboxmaterial = new THREE.MeshLambertMaterial({
        map: new THREE.TextureLoader().load("assets/henrytxtbox.png"),
        transparent: true,
        alphaTest: 0.2,
      });

      // load models
      loadobj(vacuum, "assets/henry.json", hmaterial);
      loadobj(handle, "assets/handle.json", hmaterial);
      loadobj(vacuum, "assets/face.json", facematerial);
      loadobj(vacuum, "assets/txtbox.json", txtboxmaterial);

      function loadobj(grp, obj, mat) {
        loader.load(
          obj,
          function (geometry) {
            const object = new THREE.Mesh(geometry, mat);
            fixtexture(object.material.map);
            object.castShadow = true;
            object.receiveShadow = true;
            if (grp == vacuum) {
              object.position.set(0, -1.2, 0);
            }
            grp.add(object);
          },
          function (xhr) {
            // console.log( (xhr.loaded / xhr.total * 100) + '% loaded' );
          },
          function (err) {
            // console.log( 'An error happened' );
          }
        );
      }

      //
      function fixtexture(tex) {
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
      }

      // Physics-based Rope Class with Ground Physics and Non-Stretch Constraint
      class Rope {
        constructor(startPoint, endPoint, segments = 15, segmentLength = 0.5) {
          this.segments = segments;
          this.segmentLength = segmentLength;
          this.points = [];
          this.oldPoints = [];
          this.meshes = [];
          this.group = new THREE.Group();
          this.groundLevel = 0; // Ground is at y=0

          // Initialize points along the tube
          for (let i = 0; i < segments; i++) {
            const t = i / (segments - 1);
            const point = new THREE.Vector3().lerpVectors(
              startPoint,
              endPoint,
              t
            );
            this.points.push(point.clone());
            this.oldPoints.push(point.clone());

            // Create visual representation for each segment
            if (i > 0) {
              const geometry = new THREE.CylinderGeometry(
                0.03,
                0.03,
                segmentLength,
                8
              );
              const material = new THREE.MeshStandardMaterial({
                color: 0x111111,
                roughness: 0.7,
                metalness: 0.1,
              });
              const segment = new THREE.Mesh(geometry, material);
              segment.castShadow = true;

              this.meshes.push(segment);
              this.group.add(segment);
            }
          }

          // Add a henry sphere at the end point only
          const handleGeometry = new THREE.SphereGeometry(0.04, 4, 4);
          const handleMaterial = new THREE.MeshBasicMaterial({
            color: 0x222222,
          });
          this.handle = new THREE.Mesh(handleGeometry, handleMaterial);
          this.handle.position.copy(this.points[this.points.length - 1]);
          this.handle.castShadow = true;
          this.group.add(this.handle);

          this.updateVisuals();
        }

        // Verlet integration update with ground physics and non-stretch constraint
        update(
          startPoint,
          endPoint,
          gravity = new THREE.Vector3(0, -0.001, 0)
        ) {
          // Fix start point (anchored)
          this.points[0].copy(startPoint);

          // Only fix end point if not being dragged
          if (!isDragging) {
            this.points[this.points.length - 1].copy(endPoint);
          }

          // Verlet integration for middle points
          for (let i = 1; i < this.points.length - 1; i++) {
            const velocity = new THREE.Vector3().subVectors(
              this.points[i],
              this.oldPoints[i]
            );
            this.oldPoints[i].copy(this.points[i]);

            // Apply gravity
            velocity.add(gravity);

            // Add damping
            velocity.multiplyScalar(0.99);

            // Update position
            this.points[i].add(velocity);

            // Ground collision - prevent points from going below ground
            if (this.points[i].y < this.groundLevel) {
              this.points[i].y = this.groundLevel;

              // Apply bounce/friction when hitting ground
              const groundNormal = new THREE.Vector3(0, 1, 0);
              const reflection = velocity.clone().reflect(groundNormal);
              reflection.multiplyScalar(0.3); // Dampen bounce
              this.oldPoints[i].sub(reflection);
            }
          }

          // Apply non-stretch constraints with more iterations for rigidity
          for (let iteration = 0; iteration < 10; iteration++) {
            for (let i = 0; i < this.points.length - 1; i++) {
              const point1 = this.points[i];
              const point2 = this.points[i + 1];
              const delta = new THREE.Vector3().subVectors(point2, point1);
              const distance = delta.length();
              const difference = (distance - this.segmentLength) / distance;

              // Apply constraint with different handling for fixed vs free points
              if (i > 0 && !(i === this.points.length - 2 && isDragging)) {
                // Move point1 (unless it's the fixed start point)
                point1.add(delta.clone().multiplyScalar(0.5 * difference));

                // Ensure point doesn't go below ground after constraint
                point1.y = Math.max(point1.y, this.groundLevel);
              }

              if (i < this.points.length - 2 || !isDragging) {
                // Move point2 (unless it's the dragged end point)
                point2.sub(delta.clone().multiplyScalar(0.5 * difference));

                // Ensure point doesn't go below ground after constraint
                point2.y = Math.max(point2.y, this.groundLevel);
              }
            }
          }

          this.updateVisuals();
        }

        updateVisuals() {
          for (let i = 0; i < this.meshes.length; i++) {
            const start = this.points[i];
            const end = this.points[i + 1];
            const segment = this.meshes[i];

            const direction = new THREE.Vector3().subVectors(end, start);
            const length = direction.length();
            const center = new THREE.Vector3()
              .addVectors(start, end)
              .multiplyScalar(0.5);

            segment.position.copy(center);
            segment.scale.y = length / this.segmentLength;
            segment.lookAt(end);
            segment.rotateX(Math.PI / 2);
          }

          // Update handle position
          this.handle.position.copy(this.points[this.points.length - 1]);
        }
      }

      // Create tube
      const tube = new Rope(
        new THREE.Vector3(0, 2, 0), // Start point (fixed)
        new THREE.Vector3(0, 0, 0), // End point (draggable)
        20,
        0.4
      );
      scene.add(tube.group);

      // Mouse interaction
      const mouse = new THREE.Vector2();
      const raycaster = new THREE.Raycaster();
      let isDragging = false;

      document.addEventListener("mousedown", (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        // Check if clicking near the tube's end point (handle)
        const endPoint = tube.points[tube.points.length - 1];
        const distanceToEnd = raycaster.ray.distanceToPoint(endPoint);

        if (distanceToEnd < 0.5 && !btnpressed) {
          isDragging = true;
          document.body.style.cursor = "pointer";
          controls.enabled = false;
          startsfx();
          startosc();
          isMouseDown = true;
          //
          sfxaudio.play();
          xval = 1;
        }
      });

      document.addEventListener("mousemove", (event) => {
        if (!isDragging) return;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        // Find intersection with a plane at average height for natural dragging
        const avgY =
          tube.points.reduce((sum, point) => sum + point.y, 0) /
          tube.points.length;
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -avgY);
        const intersectionPoint = new THREE.Vector3();
        raycaster.ray.intersectPlane(plane, intersectionPoint);

        // Update the end point position
        tube.points[tube.points.length - 1].copy(intersectionPoint);

        // Ensure it doesn't go below ground
        tube.points[tube.points.length - 1].y = Math.max(
          tube.points[tube.points.length - 1].y,
          tube.groundLevel
        );
      });

      document.addEventListener("mouseup", () => {
        isDragging = false;
        document.body.style.cursor = "default";
        controls.enabled = true;
        stoposc();
        isMouseDown = false;
        sfxaudio.pause();
        xval = 0;
      });

      // Animation loop
      function animate() {
        requestAnimationFrame(animate);

        // time
        const time = Date.now() * 0.001;

        if (!started) {
          tube.points[0].x = Math.sin(time);
          tube.points[0].z = Math.cos(time);
          // started = true;
        }

        // Update tube physics
        tube.update(tube.points[0], tube.points[tube.points.length - 1]);
 
        const currentVacuumPosition = tube.points[tube.points.length - 1];

        // position objects
        handle.position.set(
          tube.points[0].x,
          tube.points[0].y,
          tube.points[0].z
        );
        handle.lookAt(tube.points[2].x, tube.points[2].y, tube.points[2].z);
        vacuum.position.set(
          tube.points[tube.points.length - 1].x,
          tube.points[tube.points.length - 1].y,
          tube.points[tube.points.length - 1].z
        );
        vacuum.lookAt(
          tube.points[tube.points.length - 2].x,
          tube.points[tube.points.length - 2].y,
          tube.points[tube.points.length - 2].z
        );


        //
         if (frameCount > 0) {
          const delta = new THREE.Vector3().subVectors(currentVacuumPosition, previousVacuumPosition);
          vacuumSpeed = delta.length()*400;
          // console.log("Vacuum speed:", vacuumSpeed.toFixed(4));
        }
        
        // Store current position for next frame
        previousVacuumPosition.copy(currentVacuumPosition);
        frameCount++;
        
        // lerp
        lerped += (xval - lerped)*0.05;
        sfxaudio.volume = lerped;
        // sfxaudio.playbackRate = ;

        // sound
        // drag audio
        if (isMouseDown && !btnpressed) {
          var distance = dist(vacuum.position.x,vacuum.position.y,vacuum.position.z,0,0,0);
          if(distance>10){return}
          var ang = vacuum.rotation.y * 100;
          setcontrol(
             ang + vacuum.position.x * 100,
             ang + vacuum.position.z * 100
          );
        }
        // btn audio
        if(btnpressed && !isMouseDown){
          var ang = (vacuum.rotation.y * 100);
          setcontrol(
            vacuumSpeed + ang + vacuum.position.x * 100,
            vacuumSpeed + ang + vacuum.position.z * 100
          );
          // if(vacuumSpeed*0.1 > 0 && vacuumSpeed*0.1 < 1){
          //  sfxaudio.playbackRate = vacuumSpeed*0.1;
          // }
        }

        // render
        renderer.render(scene, camera);
      }

      function dist(x0,y0,z0,x1,y1,z1){
        deltaX = x1 - x0;
        deltaY = y1 - y0;
        deltaZ = z1 - z0;
        distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY + deltaZ * deltaZ);
        return distance;
     }

      // Handle window resize
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // globals
      var context;
      var gainNode;
      var oscillator;
      var left_osc;
      var startedosc = false;
      var rampDuration = 0.5;
      var isMouseDown = false;
      // gainNode.connect(context.destination);

      function startsfx() {
        context = new AudioContext();
        gainNode = context.createGain();
        gainNode.connect(context.destination);
      }
      // start oscillator
      function startosc() {
        startedosc = true;
        oscillator = context.createOscillator();
        oscillator.connect(gainNode);
        left_osc = context.createOscillator();
        left_osc.connect(gainNode);
        gainNode.gain.setValueAtTime(0.0001, context.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(
          0.3,
          context.currentTime + rampDuration
        );
        oscillator.start();
        left_osc.start();
      }

      // stop oscillator
      function stoposc() {
        if (!startedosc) {
          return;
        }
        startedosc = false;

        gainNode.gain.setValueAtTime(gainNode.gain.value, context.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(
          0.0001,
          context.currentTime + rampDuration
        );
        setTimeout(function () {
          oscillator.stop();
          left_osc.stop();
            gainNode.disconnect()
        }, rampDuration * 1000);
      }

      // convert position to sound
      function setcontrol(x, y) {
        if (typeof oscillator != "undefined") {
          oscillator.frequency.value = x;
          left_osc.frequency.value = x + y;
        }
      }

      // Start animation
      var started = false;
      animate();
    </script>
  </body>
</html>
