<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>webrtc cubes</title>
    <style>
      body {padding: 0; margin: 0; overflow: hidden; background: #111; }
  </style>
</head>
<body>
<div id="info" style="position:absolute; top:10px; left:10px; color:white; background:rgba(0,0,0,0.7); padding:10px; font-family:monospace; z-index:1000; border-radius:5px;">
    <div>My ID: <span id="my-id">-</span></div>
    <div>Users: <span id="user-count">0</span></div>
    <div id="user-list"></div>
    <div>Status: <span id="status">starting...</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>
// UI elements
const myIdEl = document.getElementById('my-id')
const userCountEl = document.getElementById('user-count')
const userListEl = document.getElementById('user-list')
const statusEl = document.getElementById('status')

// Generate a random ID
const myId = Math.random().toString(36).substring(2, 8)
myIdEl.textContent = myId

// Three.js setup
const scene = new THREE.Scene()
scene.background = new THREE.Color(0x111122)
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000)
const renderer = new THREE.WebGLRenderer()
renderer.setSize(window.innerWidth, window.innerHeight)
document.body.appendChild(renderer.domElement)

const controls = new THREE.OrbitControls(camera, renderer.domElement)
camera.position.set(5, 5, 5)
controls.enableDamping = true

const gridHelper = new THREE.GridHelper(10, 20, 0x8888ff, 0x333344)
scene.add(gridHelper)

const geometry = new THREE.BoxGeometry(1, 1, 1)
const material = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff })
const cube = new THREE.Mesh(geometry, material)
cube.position.set(Math.random() * 4 - 2, 0.5, Math.random() * 4 - 2)
scene.add(cube)

const light = new THREE.AmbientLight(0x404060)
scene.add(light)
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8)
directionalLight.position.set(1, 2, 1)
scene.add(directionalLight)

// Other users
const otherCubes = new Map()
const users = new Map()

// Connect to working public server
statusEl.textContent = 'connecting...'
const socket = io('wss://websocket-demo.onrender.com/', {
    path: '/socket.io/',
    transports: ['websocket'],
    reconnection: true,
    reconnectionAttempts: 5,
    timeout: 10000
})

socket.on('connect', () => {
    statusEl.textContent = 'connected!'
    socket.emit('join-room', 'bryce-room', myId)
    
    // Announce ourselves
    socket.emit('user-move', {
        id: myId,
        color: material.color.getHex(),
        x: cube.position.x,
        y: cube.position.y,
        z: cube.position.z
    })
})

socket.on('connect_error', (err) => {
    statusEl.textContent = 'connection failed, retrying...'
    console.log(err)
})

socket.on('user-joined', (userId) => {
    statusEl.textContent = 'user joined: ' + userId.substr(0,4)
})

socket.on('room-users', (usersList) => {
    users.clear()
    usersList.forEach(userId => {
        if (userId !== myId) {
            users.set(userId, { lastSeen: Date.now() })
        }
    })
    updateUserList()
})

socket.on('user-move', (data) => {
    if (data.id === myId) return
    
    let otherCube = otherCubes.get(data.id)
    if (!otherCube) {
        otherCube = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: data.color }))
        scene.add(otherCube)
        otherCubes.set(data.id, otherCube)
        users.set(data.id, { color: data.color, lastSeen: Date.now() })
        updateUserList()
    }
    
    otherCube.position.set(data.x, data.y, data.z)
    if (users.has(data.id)) {
        users.get(data.id).lastSeen = Date.now()
        users.get(data.id).color = data.color
    }
})

socket.on('user-left', (userId) => {
    users.delete(userId)
    const cube = otherCubes.get(userId)
    if (cube) {
        scene.remove(cube)
        otherCubes.delete(userId)
    }
    updateUserList()
    statusEl.textContent = 'user left: ' + userId.substr(0,4)
})

socket.on('disconnect', () => {
    statusEl.textContent = 'disconnected'
})

function updateUserList() {
    userCountEl.textContent = users.size
    
    let listHtml = ''
    users.forEach((user, id) => {
        const shortId = id.substr(0, 6)
        const color = user.color || 0xffffff
        listHtml += `<div style="color: #${color.toString(16).padStart(6, '0')}">● ${shortId}</div>`
    })
    userListEl.innerHTML = listHtml || '<div style="color:#666">no other users</div>'
}

// Broadcast position
setInterval(() => {
    if (socket.connected) {
        socket.emit('user-move', {
            id: myId,
            color: material.color.getHex(),
            x: cube.position.x,
            y: cube.position.y,
            z: cube.position.z
        })
    }
}, 100)

// Keyboard controls
document.addEventListener("keydown", (e) => {
    const speed = 0.2
    if (e.key === "ArrowLeft") cube.position.x -= speed
    if (e.key === "ArrowRight") cube.position.x += speed
    if (e.key === "ArrowUp") cube.position.z -= speed
    if (e.key === "ArrowDown") cube.position.z += speed
    if (e.key === "PageUp") cube.position.y += speed
    if (e.key === "PageDown") cube.position.y -= speed
})

// Animation
function animate() {
    requestAnimationFrame(animate)
    controls.update()
    renderer.render(scene, camera)
}
animate()

// Resize handler
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight
    camera.updateProjectionMatrix()
    renderer.setSize(window.innerWidth, window.innerHeight)
})
</script>
</body>
</html>
