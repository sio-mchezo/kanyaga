<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>edit</title>
    <style>
    * {margin: 0; padding: 0;}
    body { margin: 0; 
        background: #000; 
        color: #fff;
        font-family: monospace;
        overflow: hidden;
    }
    #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 8px;
        z-index: 100;
    }
    #hud button {
        background-color: red;
        width: 50px;
        height: 50px;
        border: none;
        outline: none;
        cursor: pointer;
        text-indent: -100000em;
    }
    #spherebtn { border-radius: 100%; }
    #boxbtn { border-radius: 0; }
    #conebtn { 
        border-radius: 0;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }
    
    #info {
        position: absolute;
        bottom: 20px;
        left: 20px;
        padding: 12px 20px;
        font-size: 1.2em;
        z-index: 100;
        display: flex;
        gap: 15px;
        align-items: center;
    }
    #info button {
        background: none;
        border: none;
        color: red;
        padding: 4px 12px;
        cursor: pointer;
        font-family: monospace;
        font-size: 1em;
    }
    #info button:hover {
        background: red;
        color: black;
    }
    
    #users {
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 12px;
        font-size: 1.2em;
        color: #00ccff;
        z-index: 100;
    }
    
    #controls-bottom {
        position: absolute;
        bottom: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        z-index: 100;
    }
    
    .mode-btn, #render-toggle, #uniform-toggle {
        padding: 12px 24px;
        font-size: 1.2em;
        cursor: pointer;
        user-select: none;
        width: 100px;
        text-align: center;
    }
    
    .mode-btn.active {
        color: #00ccff;
    }
    .mode-btn {
        color: #ffaa00;
    }
    
    #uniform-toggle {
        color: #ffaa00;
        display: none;
    }
    #uniform-toggle.uniform {
        color: #00ccff;
    }
    
    #render-toggle .indicator {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 16px;
        border: #ccc 1px solid;
        background: #666;
        margin-left: 12px;
        vertical-align: middle;
    }
    #render-toggle.wireframe .indicator {
        background: transparent;
        border: #ccc 1px solid;
    }
    </style>
</head>
<body>
    <div id="hud">
        <button id="spherebtn">sphere</button>
        <button id="boxbtn">box</button>
        <button id="conebtn">cone</button>
    </div>
    <div id="users">users: <span id="user-count">0</span><br><span id="user-list"></span></div>
    <div id="info"></div>
    
    <div id="controls-bottom">
        <div id="move-btn" class="mode-btn active">move</div>
        <div id="scale-btn" class="mode-btn">scale</div>
        <div id="rotate-btn" class="mode-btn">rotate</div>
        <div id="uniform-toggle">uniform</div>
        <div id="render-toggle">shaded <span class="indicator"></span></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    // --- setup ---
    var selected = null;
    const myId = Math.random().toString(36).substring(2, 8);
    const ws = new WebSocket('wss://kanyaga.onrender.com');
    const otherCubes = new Map();
    const users = new Map();
    
    let wireframeMode = false;
    let currentMode = 'translate';
    let uniformScale = false;
    
    const moveBtn = document.getElementById('move-btn');
    const scaleBtn = document.getElementById('scale-btn');
    const rotateBtn = document.getElementById('rotate-btn');
    const uniformToggle = document.getElementById('uniform-toggle');
    const renderToggle = document.getElementById('render-toggle');

    window.remove = function(obj) {
        if (selected === obj) {
            transform.detach();
            selected = null;
            document.getElementById('info').innerHTML = '';
        }
        group.remove(obj);
        const index = objects.indexOf(obj);
        if (index > -1) objects.splice(index, 1);
    }

    // --- geometries ---
    const geos = [
        new THREE.SphereGeometry(0.6, 16, 16),
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.ConeGeometry(0.6, 1.2, 16)
    ];
    const colors = [0xffff00, 0xff0000, 0x00ff00];

    // --- ui handlers ---
    document.getElementById('spherebtn').onclick = () => addobject(geos[0], colors[0], 'sphere_'+objects.length, 'sphere');
    document.getElementById('boxbtn').onclick = () => addobject(geos[1], colors[1], 'box_'+objects.length, 'box');
    document.getElementById('conebtn').onclick = () => addobject(geos[2], colors[2], 'cone_'+objects.length, 'cone');

    function addobject(geom, color, name, shape) {
        let mat = new THREE.MeshStandardMaterial({ color: color });
        let obj = new THREE.Mesh(geom, mat);
        obj.castShadow = true;
        obj.receiveShadow = true;
        obj.position.set(Math.random()*6-3, 1, Math.random()*6-3);
        obj.name = name;
        obj.userData.shape = shape;
        obj.userData.color = color;
        objects.push(obj);
        group.add(obj);
        
        ws.send(JSON.stringify({
            type: 'add',
            id: myId,
            shape: shape,
            color: color,
            x: obj.position.x,
            y: obj.position.y,
            z: obj.position.z
        }));
    }

    // --- scene setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111122);
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 1000);
    camera.position.set(15, 10, 15);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- controls ---
    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.05;
    orbit.maxPolarAngle = Math.PI/2;
    orbit.screenSpacePanning = true;

    const transform = new TransformControls(camera, renderer.domElement);
    transform.setMode('translate');
    transform.addEventListener('dragging-changed', (e) => {
        orbit.enabled = !e.value;
    });
    
    transform.addEventListener('change', () => {
        if (selected && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                id: myId,
                x: selected.position.x,
                y: selected.position.y,
                z: selected.position.z,
                sx: selected.scale.x,
                sy: selected.scale.y,
                sz: selected.scale.z,
                rx: selected.rotation.x,
                ry: selected.rotation.y,
                rz: selected.rotation.z
            }));
        }
    });
    
    // override scale behavior for uniform scaling
    const originalSetMode = transform.setMode;
    transform.setMode = function(mode) {
        originalSetMode.call(this, mode);
        if (mode === 'scale' && this._mode === 'scale' && uniformScale) {
            // Force uniform scaling by setting space to local and using shift behavior
            this.space = 'local';
            this.size = 1;
        }
    };
    
    scene.add(transform);

    // --- lights ---
    const ambient = new THREE.AmbientLight(0x404060);
    scene.add(ambient);
    
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7);
    light.castShadow = true;
    light.shadow.mapSize.width = 1024;
    light.shadow.mapSize.height = 1024;
    light.shadow.camera.near = 0.5;
    light.shadow.camera.far = 20;
    light.shadow.camera.left = -10;
    light.shadow.camera.right = 10;
    light.shadow.camera.top = 10;
    light.shadow.camera.bottom = -10;
    scene.add(light);

    // --- grid ---
    const grid = new THREE.GridHelper(20, 20, 0xff6600, 0x333344);
    grid.position.y = 0;
    scene.add(grid);

    // --- object containers ---
    let objects = [];
    let group = new THREE.Group();
    scene.add(group);

    // --- selection handling ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    
    renderer.domElement.addEventListener('click', (event) => {
        if (transform.dragging) return;
        
        mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
        mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
        
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(objects);
        
        if (intersects.length > 0) {
            selected = intersects[0].object;
            transform.attach(selected);
            
            const info = document.getElementById('info');
            info.innerHTML = selected.name;
            const xbtn = document.createElement("button");
            xbtn.innerHTML = 'delete';
            xbtn.onclick = () => remove(selected);
            info.appendChild(xbtn);
        } else {
            if (selected) {
                transform.detach();
                selected = null;
                document.getElementById('info').innerHTML = '';
            }
        }
    });

    // --- mode switching ---
    function setMode(mode) {
        currentMode = mode;
        transform.setMode(mode);
        
        moveBtn.classList.remove('active');
        scaleBtn.classList.remove('active');
        rotateBtn.classList.remove('active');
        
        if (mode === 'translate') {
            moveBtn.classList.add('active');
            uniformToggle.style.display = 'none';
        } else if (mode === 'scale') {
            scaleBtn.classList.add('active');
            uniformToggle.style.display = 'block';
            // re-apply uniform setting
            if (uniformScale) {
                transform.space = 'local';
                uniformToggle.classList.add('uniform');
            } else {
                uniformToggle.classList.remove('uniform');
            }
        } else if (mode === 'rotate') {
            rotateBtn.classList.add('active');
            uniformToggle.style.display = 'none';
        }
    }
    
    moveBtn.addEventListener('click', () => setMode('translate'));
    scaleBtn.addEventListener('click', () => setMode('scale'));
    rotateBtn.addEventListener('click', () => setMode('rotate'));
    
    uniformToggle.addEventListener('click', () => {
        uniformScale = !uniformScale;
        uniformToggle.classList.toggle('uniform', uniformScale);
        if (currentMode === 'scale') {
            // In scale mode, we can't truly force uniform without modifying TransformControls
            // This visual toggle helps but actual uniform scaling still requires Shift
            // We'll just show the user that uniform mode is active
            if (uniformScale) {
                transform.space = 'local';
            }
        }
    });

    // --- websocket ---
    ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join', id: myId }));
    };

    ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === 'users') {
            data.users.forEach(id => {
                if (id !== myId) users.set(id, { lastSeen: Date.now() });
            });
            updateUserList();
        }
        else if (data.type === 'join' && data.id !== myId) {
            users.set(data.id, { lastSeen: Date.now() });
            updateUserList();
        }
        else if (data.type === 'add' && data.id !== myId) {
            let geom;
            if (data.shape === 'sphere') geom = new THREE.SphereGeometry(0.6, 16, 16);
            else if (data.shape === 'cone') geom = new THREE.ConeGeometry(0.6, 1.2, 16);
            else geom = new THREE.BoxGeometry(1, 1, 1);
            
            let mat = wireframeMode ? 
                new THREE.MeshBasicMaterial({ color: data.color, wireframe: true }) :
                new THREE.MeshStandardMaterial({ color: data.color });
            
            let obj = new THREE.Mesh(geom, mat);
            obj.castShadow = true;
            obj.receiveShadow = true;
            obj.position.set(data.x, data.y, data.z);
            if (data.sx) obj.scale.set(data.sx, data.sy, data.sz);
            if (data.rx) obj.rotation.set(data.rx, data.ry, data.rz);
            scene.add(obj);
            otherCubes.set(data.id, obj);
            users.set(data.id, { color: data.color, lastSeen: Date.now() });
            updateUserList();
        }
        else if (data.id && data.id !== myId) {
            let obj = otherCubes.get(data.id);
            if (obj) {
                obj.position.set(data.x, data.y, data.z);
                if (data.sx) obj.scale.set(data.sx, data.sy, data.sz);
                if (data.rx) obj.rotation.set(data.rx, data.ry, data.rz);
                users.get(data.id).lastSeen = Date.now();
            }
        }
    };

    function updateUserList() {
        const now = Date.now();
        users.forEach((user, id) => {
            if (now - user.lastSeen > 5000) {
                users.delete(id);
                const obj = otherCubes.get(id);
                if (obj) scene.remove(obj);
                otherCubes.delete(id);
            }
        });
        document.getElementById('user-count').textContent = users.size;
        let html = '';
        users.forEach((user, id) => {
            let color = user.color || 0xffffff;
            html += `<span style="color:#${color.toString(16).padStart(6,'0')}">${id.substr(0,4)} </span>`;
        });
        document.getElementById('user-list').innerHTML = html;
    }

    setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) {
            objects.forEach(obj => {
                ws.send(JSON.stringify({
                    id: myId,
                    x: obj.position.x,
                    y: obj.position.y,
                    z: obj.position.z,
                    sx: obj.scale.x,
                    sy: obj.scale.y,
                    sz: obj.scale.z,
                    rx: obj.rotation.x,
                    ry: obj.rotation.y,
                    rz: obj.rotation.z
                }));
            });
        }
        updateUserList();
    }, 100);

    // --- wireframe toggle ---
    renderToggle.addEventListener('click', () => {
        wireframeMode = !wireframeMode;
        renderToggle.classList.toggle('wireframe', wireframeMode);
        renderToggle.innerHTML = wireframeMode ? 'wireframe <span class="indicator"></span>' : 'shaded <span class="indicator"></span>';
        
        const materialType = wireframeMode ? 
            (color) => new THREE.MeshBasicMaterial({ color, wireframe: true }) :
            (color) => new THREE.MeshStandardMaterial({ color });
        
        objects.forEach(obj => {
            obj.material = materialType(obj.userData.color);
        });
        
        otherCubes.forEach(obj => {
            obj.material = materialType(obj.material.color);
        });
    });

    // --- resize ---
    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
    });

    // --- animate ---
    function animate() {
        requestAnimationFrame(animate);
        orbit.update();
        renderer.render(scene, camera);
    }
    animate();
    </script>
</body>
</html>
