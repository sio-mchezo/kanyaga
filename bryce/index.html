<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>collaborative cubes</title>
    <style>
      body {padding: 0; margin: 0; overflow: hidden; background: #111; }
  </style>
</head>
<body>
<div id="info" style="position:absolute; top:10px; left:10px; color:white; background:rgba(0,0,0,0.7); padding:10px; font-family:monospace; z-index:1000; border-radius:5px;">
    <div>My ID: <span id="my-id">-</span></div>
    <div>Users: <span id="user-count">0</span></div>
    <div id="user-list"></div>
    <div>Status: <span id="status">starting...</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// UI elements
const myIdEl = document.getElementById('my-id')
const userCountEl = document.getElementById('user-count')
const userListEl = document.getElementById('user-list')
const statusEl = document.getElementById('status')

// Generate a random ID
const myId = Math.random().toString(36).substring(2, 8)
myIdEl.textContent = myId

// Three.js setup
const scene = new THREE.Scene()
scene.background = new THREE.Color(0x111122)
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000)
const renderer = new THREE.WebGLRenderer()
renderer.setSize(window.innerWidth, window.innerHeight)
document.body.appendChild(renderer.domElement)

const controls = new THREE.OrbitControls(camera, renderer.domElement)
camera.position.set(5, 5, 5)
controls.enableDamping = true

const gridHelper = new THREE.GridHelper(10, 20, 0x8888ff, 0x333344)
scene.add(gridHelper)

const geometry = new THREE.BoxGeometry(1, 1, 1)
const material = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff })
const cube = new THREE.Mesh(geometry, material)
cube.position.set(Math.random() * 4 - 2, 0.5, Math.random() * 4 - 2)
scene.add(cube)

const light = new THREE.AmbientLight(0x404060)
scene.add(light)
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8)
directionalLight.position.set(1, 2, 1)
scene.add(directionalLight)

// Other users
const otherCubes = new Map()
const users = new Map()

// Connect to YOUR Render server
statusEl.textContent = 'connecting...'
// CHANGE THIS URL to your actual Render app URL
const ws = new WebSocket('wss://kanyaga.onrender.com/')

ws.onopen = () => {
    statusEl.textContent = 'connected to server'
    // Announce ourselves
    ws.send(JSON.stringify({
        type: 'join',
        id: myId,
        color: material.color.getHex(),
        x: cube.position.x,
        y: cube.position.y,
        z: cube.position.z
    }))
}

ws.onmessage = (event) => {
    const data = JSON.parse(event.data)
    
    if (data.type === 'users') {
        // List of existing users
        data.users.forEach(id => {
            if (id !== myId && !users.has(id)) {
                users.set(id, { color: 0xffffff, lastSeen: Date.now() })
            }
        })
        updateUserList()
    }
    else if (data.type === 'join') {
        // New user joined
        if (data.id !== myId && !users.has(data.id)) {
            users.set(data.id, { color: data.color, lastSeen: Date.now() })
            statusEl.textContent = 'user joined: ' + data.id.substr(0,4)
            updateUserList()
        }
    }
    else if (data.id && data.id !== myId) {
        // Position update
        let otherCube = otherCubes.get(data.id)
        if (!otherCube) {
            otherCube = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: data.color }))
            scene.add(otherCube)
            otherCubes.set(data.id, otherCube)
            users.set(data.id, { color: data.color, lastSeen: Date.now() })
            updateUserList()
            statusEl.textContent = 'seeing user: ' + data.id.substr(0,4)
        }
        otherCube.position.set(data.x, data.y, data.z)
        if (users.has(data.id)) {
            users.get(data.id).lastSeen = Date.now()
        }
    }
}

ws.onclose = () => {
    statusEl.textContent = 'disconnected - refresh page'
}

ws.onerror = (err) => {
    statusEl.textContent = 'connection error'
    console.error(err)
}

function updateUserList() {
    // Clean up stale users (not seen for 5 seconds)
    const now = Date.now()
    users.forEach((user, id) => {
        if (now - user.lastSeen > 5000) {
            users.delete(id)
            const cube = otherCubes.get(id)
            if (cube) {
                scene.remove(cube)
                otherCubes.delete(id)
            }
        }
    })
    
    userCountEl.textContent = users.size
    
    let listHtml = ''
    users.forEach((user, id) => {
        const shortId = id.substr(0, 6)
        const color = user.color || 0xffffff
        listHtml += `<div style="color: #${color.toString(16).padStart(6, '0')}">● ${shortId}</div>`
    })
    userListEl.innerHTML = listHtml || '<div style="color:#666">no other users</div>'
}

// Broadcast position
setInterval(() => {
    if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
            id: myId,
            color: material.color.getHex(),
            x: cube.position.x,
            y: cube.position.y,
            z: cube.position.z
        }))
    }
    updateUserList() // Clean up stale users
}, 100)

// Keyboard controls
document.addEventListener("keydown", (e) => {
    const speed = 0.2
    if (e.key === "ArrowLeft") cube.position.x -= speed
    if (e.key === "ArrowRight") cube.position.x += speed
    if (e.key === "ArrowUp") cube.position.z -= speed
    if (e.key === "ArrowDown") cube.position.z += speed
    if (e.key === "PageUp") cube.position.y += speed
    if (e.key === "PageDown") cube.position.y -= speed
})

// Animation
function animate() {
    requestAnimationFrame(animate)
    controls.update()
    renderer.render(scene, camera)
}
animate()

// Resize handler
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight
    camera.updateProjectionMatrix()
    renderer.setSize(window.innerWidth, window.innerHeight)
})
</script>
</body>
</html>
