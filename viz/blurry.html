// update time function
player.addEventListener("timeupdate", function(){ 
  speed = 0.01;

// perlin col
var perlin = document.createElement('canvas');
ctx = perlin.getContext('2d');

var eqval = 0;

var fn = 'simplex'

// three.js stuff
var scene = new THREE.Scene();

createBG()

function createBG() {
  var geometry = new THREE.PlaneBufferGeometry( 200, 200 );
  var material = new THREE.MeshBasicMaterial( {
    map: new THREE.TextureLoader().load( 'sprite.png' ),
    transparent:true,
    opacity:0,
    // color:0xff0000,
    depthWrite: false
  } );
  spot = new THREE.Mesh( geometry, material );
  spot.material.blending = THREE.AdditiveBlending;
  scene.add( spot );
  
  // bg perlin plane
  var xgeometry = new THREE.PlaneBufferGeometry( 1200, 1200 );
  var xmaterial = new THREE.MeshBasicMaterial( { 
     transparent:true, 
     opacity:0.2,
     // color:0xff0000,
    map:new THREE.CanvasTexture(perlin),
  } );
  perlinplane = new THREE.Mesh( xgeometry, xmaterial );
  perlinplane.position.z = -100;
  scene.add( perlinplane );
}

// play/pause
var playing = false;
var paused = true;
var fadeTimer = false;


function playme() {
  if (document.body.classList == 'playing') {return}
  
  clearTimeout(fadeTimer);
  var bgAudio = document.getElementById("player");
  bgAudio.volume = 0;
  bgAudio.play();
  aud_fade_in();
  document.body.classList = 'playing';

  if (!built) {
    audioContext= new audioCtx();
    buildAudioGraph();
  }

  playing = true;
  paused = false;
}


  var aud_fade_in = function() {
    clearTimeout(fadeTimer);
    var bgAudio = document.getElementById("player");
    if (bgAudio.volume < 0.994) {
      bgAudio.volume += 0.005;
      fadeTimer = setTimeout(aud_fade_in,10);
    } else {
      bgAudio.volume = 1;
    }
  };
    var aud_fade_out = function() {
    clearTimeout(fadeTimer);
    var bgAudio = document.getElementById("player");
    if (bgAudio.volume > 0.005) {
      bgAudio.volume -= 0.005;
      fadeTimer = setTimeout(aud_fade_out,5);
    } else {
      bgAudio.volume = 0;
      bgAudio.pause();
    }
    playing = false;
    paused = true;
    document.body.classList = 'paused';
    document.body.style.background = 'black';
  };


var xnum = 0;
var ynum = 0;
var audioCtx = window.AudioContext || window.webkitAudioContext;
var audioContext, canvasContext;

var filters = [];

var analyser;
var dataArray, bufferLength;
var masterGain, stereoPanner;
var mediaElement = document.getElementById('player');
var built = false;


function buildAudioGraph() {
    built = true;

    sourceNode =   audioContext.createMediaElementSource(mediaElement);
  
  // Create an analyser node
  analyser = audioContext.createAnalyser();
  analyser.fftSize = 256;
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);
  
    // Set filters
    [60, 170].forEach(function(freq, i) {
      var eq = audioContext.createBiquadFilter();
      eq.frequency.value = freq;
      eq.type = "peaking";
      eq.gain.value = 0;
      filters.push(eq);
    });

   // Connect filters
   sourceNode.connect(filters[0]);

   for(var i = 0; i < filters.length - 1; i++) {
      filters[i].connect(filters[i+1]);
    }
  
    // Master volume
  masterGain = audioContext.createGain();
  masterGain.value = 1;
 
   // last filter
   filters[filters.length - 1].connect(masterGain);
  
  // stereo balancing
  stereoPanner = audioContext.createStereoPanner();
  // master volume output to the panner
  masterGain.connect(stereoPanner);
  
  // stereo panner to analyser
  stereoPanner.connect(analyser);  
  analyser.connect(audioContext.destination);
}


// resize
window.addEventListener('resize', onWindowResize, false);

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}





function animate() {
  if (playing) {
    // set analyzer
    analyser.getByteFrequencyData(dataArray);
    var nbFreq = dataArray.length;

    // get/set amount
  	xamount = 0.2*dataArray[Math.round((20 * nbFreq) / 256)];
    xnum += (xamount - xnum)*0.05;
    
    // perlin
    drawFrame();
    
  } 

  if (paused) {
    xnum += (0 - xnum)*0.02;
  }

  spot.material.opacity = (xnum/300);
  spot.material.needsUpdate = true;
  perlinplane.material.map.needsUpdate = true;
  perlinplane.material.opacity = (xnum/100);
  bgscreen.material.displacementScale = xnum*2;
  bgscreen.material.opacity = perlinplane.material.opacity*2;
  bgscreen.material.displacementMap.needsUpdate = true;
  bgscreen.material.displacementScale.needsUpdate = true;

  renderer.render( scene, camera );
  requestAnimationFrame(animate);
}



function drawFrame() {
xtime++;

  var start = Date.now();

  var cWidth = perlin.width;
  var cHeight = perlin.height;

  var max = -Infinity, min = Infinity;
  var noisefn = fn = noise.simplex3;
  // var noisefn = fn = 'simplex' ? noise.simplex3 : noise.perlin3;

  for (var x = 0; x < cWidth; x++) {
    for (var y = 0; y < cHeight; y++) {
      var value = noisefn(x / 50, (xtime/xspeed)+y / 50, xtime/xspeed);

      if (max < value) max = value;
      if (min > value) min = value;

      value = (1 + value) * 1.1 * 128;

      var cell = (x + y * cWidth) * 4;
      data[cell] = data[cell + 1] = data[cell + 2] = value;
      data[cell + 3] = 255; // alpha.
    }
  }

  var end = Date.now();

  ctx.fillColor = 'black';
  ctx.fillRect(0, 0, 100, 100);
  ctx.putImageData(image, 0, 0);

}
